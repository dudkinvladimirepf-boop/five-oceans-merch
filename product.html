
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Товар — Клуб «5 океанов»</title>

<style>
* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  background: #f5f7fa;
  color: #14283a;
  font-family: Arial, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ШАПКА */

header {
  background: #102c43;
  color: white;
  padding: 22px 3%;
}

header nav {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.brand {
  font-size: 21px;
  font-weight: bold;
  white-space: nowrap;
}

.menu {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 24px;
  font-size: 14px;
}

.menu a {
  color: white;
  font-size: inherit;
  font-weight: 400;
  white-space: nowrap;
}

header nav .menu .global-cart-link {
  margin-left: 0;
}

/* ОСНОВНАЯ КАРТОЧКА */

main {
  max-width: 1150px;
  margin: 35px auto;
  padding: 20px;
}

.product {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
}

/* ФОТОГРАФИИ */

.main-photo {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  background: white;
  border-radius: 12px;
}

.thumbnails {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.thumbnails button {
  padding: 0;
  border: 2px solid transparent;
  border-radius: 8px;
  background: white;
  cursor: pointer;
}

.thumbnails button.active {
  border-color: #146789;
}

.thumbnails img {
  display: block;
  width: 75px;
  height: 75px;
  object-fit: contain;
}

.no-photo {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  border-radius: 12px;
  background: #e8f0f5;
  color: #71808e;
  text-align: center;
  padding: 20px;
}

/* ОПИСАНИЕ */

h1 {
  font-size: 32px;
  margin: 0 0 18px;
}

.description {
  line-height: 1.7;
  white-space: pre-line;
  color: #526778;
}

.price {
  font-size: 28px;
  font-weight: bold;
  margin: 24px 0;
}

.status {
  color: #28734a;
  margin: 16px 0 26px;
}

.status.off {
  color: #a03b3b;
}

/* ВЫБОР РАЗМЕРА */

.size-heading {
  font-size: 16px;
  margin: 0 0 12px;
}

.sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 30px;
}

.size {
  padding: 12px 17px;
  border: 1px solid #cbd5df;
  border-radius: 8px;
  background: white;
  color: #14283a;
  font-size: 15px;
  cursor: pointer;
}

.size.selected {
  background: #102c43;
  border-color: #102c43;
  color: white;
}

.size:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* БЛОК ПОКУПКИ */

.purchase {
  max-width: 410px;
}

.purchase-label {
  margin: 0 0 12px;
  font-size: 15px;
  font-weight: bold;
  color: #146789;
}

.purchase-line {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* КНОПКИ МИНУС / ПЛЮС */

.stepper {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  border: 1px solid #b9cdd8;
  border-radius: 9px;
  background: white;
  overflow: hidden;
}

.stepper button {
  width: 43px;
  height: 47px;
  padding: 0;
  border: 0;
  background: transparent;
  color: #146789;
  font-size: 23px;
  cursor: pointer;
}

.stepper button:hover:not(:disabled) {
  background: #e8f0f5;
}

.stepper button:disabled {
  opacity: .3;
  cursor: not-allowed;
}

.stepper-value {
  min-width: 40px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

/* СИНЯЯ КНОПКА */

.add-button {
  min-height: 49px;
  flex: 1;
  border: 0;
  border-radius: 9px;
  background: #146789;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.add-button:hover:not(:disabled) {
  background: #10516d;
}

.add-button:disabled {
  background: #aab5bd;
  cursor: not-allowed;
}

/* ЗЕЛЁНЫЙ РЕЖИМ:
   ТОВАР УЖЕ В КОРЗИНЕ */

.purchase.in-cart .purchase-label {
  color: #28734a;
}

.purchase.in-cart .purchase-line {
  display: inline-flex;
  background: #eaf7ee;
  border: 1px solid #b9dec5;
  border-radius: 12px;
  padding: 8px;
}

.purchase.in-cart .stepper {
  border-color: #79b891;
}

.purchase.in-cart .stepper button {
  color: #28734a;
}

.purchase.in-cart .stepper button:hover:not(:disabled) {
  background: #e0f2e5;
}

/* ОШИБКИ */

.message {
  margin-top: 12px;
  color: #a03b3b;
  font-size: 13px;
  line-height: 1.5;
}

.message:empty {
  display: none;
}

/* ПОДВАЛ */

footer {
  padding: 40px 20px;
  text-align: center;
  color: #71808e;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media (max-width: 700px) {
  .product {
    grid-template-columns: 1fr;
    gap: 22px;
  }

  header {
    padding: 18px 14px;
  }

  .brand {
    font-size: 17px;
  }

  .menu {
    gap: 12px;
    font-size: 12px;
  }

  main {
    margin: 20px auto;
  }

  h1 {
    font-size: 27px;
  }

  .purchase {
    max-width: 100%;
  }
}

@media (max-width: 360px) {
  .stepper button {
    width: 36px;
  }

  .stepper-value {
    min-width: 29px;
  }

  .add-button {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<header>
  <nav>
    <a href="/" class="brand">5 ОКЕАНОВ</a>

    <div class="menu">
      <a href="/">На главную</a>
    </div>
  </nav>
</header>

<main>
  <div id="content">
    Загружаем товар...
  </div>
</main>

<footer>
  Клуб «5 океанов»
</footer>

<script>

/* НАСТРОЙКИ */

const CART_KEY = "five-oceans-cart-v1";

const productSlug = new URLSearchParams(
  window.location.search
).get("slug");

const content = document.getElementById("content");

/* ОБЩИЕ ФУНКЦИИ */

function makeElement(tag, className, text) {
  const element = document.createElement(tag);

  if (className) {
    element.className = className;
  }

  if (text !== undefined) {
    element.textContent = text;
  }

  return element;
}

function formatPrice(value) {
  if (
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(Number(value))
  ) {
    return "Цена уточняется";
  }

  return new Intl.NumberFormat("ru-RU", {
    style: "currency",
    currency: "RUB",
    maximumFractionDigits: 0
  }).format(Number(value));
}

function normalizeSize(value) {
  return String(value ?? "").trim();
}

function validQuantity(value) {
  const number = Number(value);

  if (!Number.isInteger(number) || number < 1) {
    return 0;
  }

  return number;
}

/* РАБОТА С КОРЗИНОЙ */

/*
  Формат:
  [
    {
      slug: "futbolka-konyukhov",
      size: "L",
      quantity: 2
    }
  ]

  Для товара без размеров size = null.
*/

function readCart() {
  const raw = localStorage.getItem(CART_KEY);

  if (!raw) {
    return [];
  }

  const cart = JSON.parse(raw);

  if (!Array.isArray(cart)) {
    throw new Error("Неверный формат корзины");
  }

  return cart;
}

function safelyReadCart() {
  try {
    return readCart();
  } catch (error) {
    console.error("Ошибка чтения корзины:", error);
    return [];
  }
}

function isSameItem(item, slug, size) {
  return (
    item &&
    item.slug === slug &&
    normalizeSize(item.size) === normalizeSize(size)
  );
}

function cartQuantity(cart, slug, size) {
  const total = cart
    .filter(item => isSameItem(item, slug, size))
    .reduce(
      (sum, item) =>
        sum + validQuantity(item.quantity),
      0
    );

  return Math.min(99, total);
}

/*
  Изменяет только один товар и размер.
  Остальные позиции корзины сохраняются.
*/

function setItemQuantity(cart, slug, size, quantity) {

  const result = [];
  let updated = false;

  for (const item of cart) {

    if (isSameItem(item, slug, size)) {

      if (!updated && quantity > 0) {

        result.push({
          ...item,
          slug: slug,
          size: size,
          quantity: quantity
        });

        updated = true;
      }

      /*
        Повторные записи одной позиции
        не копируем, чтобы не было дублей.
      */

    } else {
      result.push(item);
    }
  }

  if (!updated && quantity > 0) {

    result.push({
      slug: slug,
      size: size,
      quantity: quantity
    });
  }

  return result;
}

function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  /*
    Обновляем счётчик в шапке.
  */

  window.dispatchEvent(
    new Event("five-oceans-cart-updated")
  );
}

/* ЗАГРУЗКА КАРТОЧКИ */

async function loadProduct() {

  try {

    const response = await fetch(
      "/data/products.json",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Не удалось загрузить товары");
    }

    const products = await response.json();

    if (!Array.isArray(products)) {
      throw new Error("Неверный формат каталога");
    }

    const product = products.find(
      item => item.slug === productSlug
    );

    if (!product) {
      content.textContent = "Товар не найден.";
      return;
    }

    document.title =
      product.title + " — Клуб «5 океанов»";

    content.replaceChildren();

    const layout = makeElement("div", "product");
    const gallery = makeElement("div");
    const details = makeElement("div");

    /* ФОТОГРАФИИ */

    const photos = Array.isArray(product.photos)
      ? product.photos.filter(Boolean)
      : [];

    if (photos.length) {

      const mainPhoto = document.createElement("img");

      mainPhoto.className = "main-photo";
      mainPhoto.src = photos[0];
      mainPhoto.alt = product.title;

      gallery.appendChild(mainPhoto);

      if (photos.length > 1) {

        const thumbnails = makeElement(
          "div",
          "thumbnails"
        );

        photos.forEach((photo, index) => {

          const button = document.createElement("button");
          button.type = "button";

          if (index === 0) {
            button.classList.add("active");
          }

          const img = document.createElement("img");

          img.src = photo;
          img.alt = "Фото " + (index + 1);

          button.appendChild(img);

          button.addEventListener("click", () => {

            mainPhoto.src = photo;

            thumbnails.querySelectorAll("button")
              .forEach(element =>
                element.classList.remove("active")
              );

            button.classList.add("active");
          });

          thumbnails.appendChild(button);
        });

        gallery.appendChild(thumbnails);
      }

    } else {

      gallery.appendChild(
        makeElement(
          "div",
          "no-photo",
          "Фотография пока отсутствует"
        )
      );
    }

    /* НАЗВАНИЕ */

    details.appendChild(
      makeElement("h1", "", product.title)
    );

    /* ОПИСАНИЕ */

    if (product.description) {

      details.appendChild(
        makeElement(
          "p",
          "description",
          product.description
        )
      );
    }

    /* ЦЕНА */

    details.appendChild(
      makeElement(
        "div",
        "price",
        formatPrice(product.price)
      )
    );

    /* НАЛИЧИЕ */

    const available = product.available === true;

    details.appendChild(
      makeElement(
        "p",
        available ? "status" : "status off",
        available ? "В наличии" : "Нет в наличии"
      )
    );

    /* СПИСОК РАЗМЕРОВ */

    const sizes = Array.isArray(product.sizes)
      ? [
          ...new Set(
            product.sizes
              .map(normalizeSize)
              .filter(Boolean)
          )
        ]
      : [];

    const savedCart = safelyReadCart();

    /*
      Если размер уже лежит в корзине,
      первоначально выбираем его.

      Если нет — выбираем первый
      размер из списка.
    */

    let selectedSize = null;

    if (sizes.length) {

      const previousItem = [...savedCart]
        .reverse()
        .find(item =>
          item.slug === product.slug &&
          sizes.includes(normalizeSize(item.size)) &&
          validQuantity(item.quantity) > 0
        );

      selectedSize = previousItem
        ? normalizeSize(previousItem.size)
        : sizes[0];
    }

    /*
      Это число используется только когда
      выбранного размера ещё нет в корзине.
    */

    let pendingQuantity = 1;

    const sizeButtons = new Map();

    if (sizes.length) {

      details.appendChild(
        makeElement(
          "h3",
          "size-heading",
          "Размер"
        )
      );

      const sizesRow = makeElement("div", "sizes");

      sizes.forEach(size => {

        const button = makeElement(
          "button",
          "size",
          size
        );

        button.type = "button";

        button.disabled = !available;

        button.setAttribute(
          "aria-pressed",
          String(size === selectedSize)
        );

        button.addEventListener("click", () => {

          selectedSize = size;
          pendingQuantity = 1;

          renderSizes();
          renderPurchase();

        });

        sizeButtons.set(size, button);
        sizesRow.appendChild(button);
      });

      details.appendChild(sizesRow);
    }

    function renderSizes() {

      sizeButtons.forEach((button, size) => {

        const selected = size === selectedSize;

        button.classList.toggle(
          "selected",
          selected
        );

        button.setAttribute(
          "aria-pressed",
          String(selected)
        );
      });
    }

    /* БЛОК ПОКУПКИ */

    const purchase = makeElement(
      "div",
      "purchase"
    );

    const purchaseLabel = makeElement(
      "p",
      "purchase-label"
    );

    const purchaseLine = makeElement(
      "div",
      "purchase-line"
    );

    /* СЧЁТЧИК */

    const stepper = makeElement(
      "div",
      "stepper"
    );

    const minusButton = makeElement(
      "button",
      "",
      "−"
    );

    minusButton.type = "button";
    minusButton.setAttribute(
      "aria-label",
      "Уменьшить количество"
    );

    const quantityDisplay = makeElement(
      "span",
      "stepper-value",
      "1"
    );

    quantityDisplay.setAttribute(
      "aria-live",
      "polite"
    );

    const plusButton = makeElement(
      "button",
      "",
      "+"
    );

    plusButton.type = "button";
    plusButton.setAttribute(
      "aria-label",
      "Увеличить количество"
    );

    stepper.appendChild(minusButton);
    stepper.appendChild(quantityDisplay);
    stepper.appendChild(plusButton);

    /* СИНЯЯ КНОПКА */

    const addButton = makeElement(
      "button",
      "add-button",
      "Добавить в корзину"
    );

    addButton.type = "button";

    /* СОБИРАЕМ БЛОК */

    purchaseLine.appendChild(stepper);
    purchaseLine.appendChild(addButton);

    purchase.appendChild(purchaseLabel);
    purchase.appendChild(purchaseLine);

    details.appendChild(purchase);

    /* СООБЩЕНИЕ ОБ ОШИБКЕ */

    const message = makeElement(
      "p",
      "message"
    );

    message.setAttribute(
      "aria-live",
      "polite"
    );

    details.appendChild(message);

    /*
      Возвращает количество выбранного
      размера, уже находящееся в корзине.
    */

    function currentCartQuantity() {

      return cartQuantity(
        safelyReadCart(),
        product.slug,
        selectedSize
      );
    }

    /* ====================================
       ПЕРЕКЛЮЧЕНИЕ СИНЕГО / ЗЕЛЁНОГО РЕЖИМА
    ==================================== */

    function renderPurchase() {

      message.textContent = "";

      const inCartCount = currentCartQuantity();

      const inCart = inCartCount > 0;

      purchase.classList.toggle(
        "in-cart",
        inCart
      );

      if (inCart) {

        /*
          ЗЕЛЁНЫЙ РЕЖИМ

          Количество — уже в корзине.
          Кнопка добавления не нужна.
        */

        purchaseLabel.textContent =
          "✓ В корзине";

        quantityDisplay.textContent =
          String(inCartCount);

        addButton.hidden = true;

        minusButton.disabled = false;

        plusButton.disabled =
          !available || inCartCount >= 99;

      } else {

        /*
          СИНИЙ РЕЖИМ

          Количество — сколько хотим
          впервые добавить.
        */

        purchaseLabel.textContent =
          "Добавить в корзину";

        quantityDisplay.textContent =
          String(pendingQuantity);

        addButton.hidden = false;
        addButton.disabled = !available;

        minusButton.disabled =
          !available || pendingQuantity <= 1;

        plusButton.disabled =
          !available || pendingQuantity >= 99;
      }

    }

    /*
      Сохраняет количество выбранного
      товара/размера в localStorage.
    */

    function updateCartQuantity(newQuantity) {

      try {

        const cart = readCart();

        const updatedCart = setItemQuantity(
          cart,
          product.slug,
          selectedSize,
          newQuantity
        );

        saveCart(updatedCart);

        /*
          При удалении последней штуки
          возвращаем обычный синий режим.
        */

        if (newQuantity === 0) {
          pendingQuantity = 1;
        }

        renderPurchase();

      } catch (error) {

        console.error(error);

        message.textContent =
          "Не удалось обновить корзину.";
      }

    }

    /* ====================================
       КНОПКА ПЛЮС
    ==================================== */

    plusButton.addEventListener("click", () => {

      const inCartCount = currentCartQuantity();

      if (inCartCount > 0) {

        /*
          В ЗЕЛЁНОМ РЕЖИМЕ
          сразу увеличиваем корзину.
        */

        if (!available || inCartCount >= 99) {
          return;
        }

        updateCartQuantity(inCartCount + 1);

      } else {

        /*
          В СИНЕМ РЕЖИМЕ
          только выбираем количество.
        */

        if (!available || pendingQuantity >= 99) {
          return;
        }

        pendingQuantity++;

        renderPurchase();
      }

    });

    /* ====================================
       КНОПКА МИНУС
    ==================================== */

    minusButton.addEventListener("click", () => {

      const inCartCount = currentCartQuantity();

      if (inCartCount > 0) {

        /*
          В ЗЕЛЁНОМ РЕЖИМЕ
          сразу уменьшаем корзину.

          При 1 - 1 = 0 позиция удаляется.
        */

        updateCartQuantity(inCartCount - 1);

      } else {

        /*
          В СИНЕМ РЕЖИМЕ
          уменьшаем выбранное количество,
          но не ниже 1.
        */

        if (!available || pendingQuantity <= 1) {
          return;
        }

        pendingQuantity--;

        renderPurchase();
      }

    });

    /* ====================================
       СИНЯЯ КНОПКА ДОБАВЛЕНИЯ
    ==================================== */

    addButton.addEventListener("click", () => {

      if (!available) {
        return;
      }

      try {

        const cart = readCart();

        const previousCount = cartQuantity(
          cart,
          product.slug,
          selectedSize
        );

        const newCount =
          previousCount + pendingQuantity;

        if (newCount > 99) {

          message.textContent =
            "Максимум 99 шт. одного размера.";

          return;
        }

        const updatedCart = setItemQuantity(
          cart,
          product.slug,
          selectedSize,
          newCount
        );

        saveCart(updatedCart);

        pendingQuantity = 1;

        /*
          Кнопка сразу превращается
          в зелёный счётчик.
        */

        renderPurchase();

      } catch (error) {

        console.error(error);

        message.textContent =
          "Не удалось добавить товар.";
      }

    });

    /* ====================================
       СИНХРОНИЗАЦИЯ МЕЖДУ СТРАНИЦАМИ
    ==================================== */

    window.addEventListener(
      "pageshow",
      renderPurchase
    );

    window.addEventListener(
      "storage",
      event => {

        if (
          event.key === CART_KEY ||
          event.key === null
        ) {
          renderPurchase();
        }
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {

        if (!document.hidden) {
          renderPurchase();
        }
      }
    );

    /* ПЕРВАЯ ОТРИСОВКА */

    renderSizes();
    renderPurchase();

    /* СОБИРАЕМ КАРТОЧКУ */

    layout.appendChild(gallery);
    layout.appendChild(details);

    content.appendChild(layout);

  } catch (error) {

    console.error(error);

    content.textContent =
      "Не удалось загрузить информацию о товаре.";
  }

}

loadProduct();

</script>

<!-- ОБЩИЙ СЧЁТЧИК КОРЗИНЫ -->

<script src="/cart-nav.js" defer></script>

</body>
</html>

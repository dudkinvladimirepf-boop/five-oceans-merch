
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Товар — Клуб «5 океанов»</title>

<style>
* { box-sizing: border-box; }

[hidden] { display: none !important; }

body {
  margin: 0;
  background: #f5f7fa;
  color: #14283a;
  font-family: Arial, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ВЕРХНЕЕ МЕНЮ */

header {
  background: #102c43;
  color: white;
  padding: 22px 3%;
}

header nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  width: 100%;
}

.brand {
  font-size: 21px;
  font-weight: bold;
  white-space: nowrap;
}

.menu {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 24px;
  font-size: 14px;
}

.menu a {
  color: white;
  font-size: inherit;
  font-weight: 400;
  white-space: nowrap;
}

header nav .menu .global-cart-link {
  margin-left: 0;
}

/* КАРТОЧКА ТОВАРА */

main {
  max-width: 1150px;
  margin: 35px auto;
  padding: 20px;
}

.product {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
}

/* ФОТОГРАФИИ */

.main-photo {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  background: white;
  border-radius: 12px;
}

.thumbnails {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.thumbnails button {
  padding: 0;
  border: 2px solid transparent;
  border-radius: 8px;
  background: white;
  cursor: pointer;
}

.thumbnails button.active {
  border-color: #146789;
}

.thumbnails img {
  width: 75px;
  height: 75px;
  object-fit: contain;
}

/* ИНФОРМАЦИЯ */

h1 {
  font-size: 32px;
}

.description {
  line-height: 1.7;
  white-space: pre-line;
}

.price {
  font-size: 28px;
  font-weight: bold;
  margin: 24px 0;
}

.status {
  color: #28734a;
}

.status.off {
  color: #a03b3b;
}

/* СОСТОЯНИЕ КОРЗИНЫ */

.cart-state {
  margin: 25px 0;
  padding: 18px;
  border: 1px solid #d6e4dd;
  border-radius: 12px;
  background: #eef7f0;
}

.cart-state-title {
  font-weight: bold;
  color: #28734a;
  margin-bottom: 12px;
}

.cart-state-items {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 14px;
}

.cart-state-link {
  display: inline-block;
  margin-top: 15px;
  color: #146789;
  font-weight: bold;
  font-size: 14px;
}

/* РАЗМЕРЫ */

.sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 12px 0 25px;
}

.size {
  padding: 12px 16px;
  border: 1px solid #cbd5df;
  border-radius: 8px;
  background: white;
  cursor: pointer;
}

.size.selected {
  background: #102c43;
  color: white;
}

.size:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* КОЛИЧЕСТВО */

.quantity {
  width: 90px;
  padding: 12px;
  border: 1px solid #cbd5df;
  border-radius: 8px;
  font-size: 16px;
}

/* КНОПКА ДОБАВЛЕНИЯ */

.add-cart {
  display: block;
  width: 100%;
  max-width: 350px;
  padding: 16px;
  margin-top: 25px;
  border: 0;
  border-radius: 9px;
  background: #102c43;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.add-cart:disabled {
  background: #aab5bd;
  cursor: not-allowed;
}

/* СООБЩЕНИЯ */

.message {
  margin-top: 15px;
  line-height: 1.5;
}

.message.success {
  color: #28734a;
}

.message.error {
  color: #a03b3b;
}

/* КНОПКИ ПЕРЕХОДА */

.cart-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 20px;
}

.action-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
}

.action-primary {
  background: #102c43;
  color: white;
}

.action-secondary {
  background: white;
  color: #102c43;
  border: 1px solid #cbd5df;
}

footer {
  text-align: center;
  padding: 40px;
  color: #71808e;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media(max-width: 700px) {

  .product {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  header {
    padding: 18px 14px;
  }

  .brand {
    font-size: 17px;
  }

  .menu {
    gap: 12px;
    font-size: 12px;
  }

  main {
    margin-top: 20px;
  }

  h1 {
    font-size: 27px;
  }

  .cart-actions {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
  <nav>
    <a href="/" class="brand">
      5 ОКЕАНОВ
    </a>

    <div class="menu">
      <a href="/">На главную</a>
    </div>
  </nav>
</header>

<main>
  <div id="content">
    Загружаем товар...
  </div>
</main>

<footer>Клуб «5 океанов»</footer>

<script>

const CART_KEY = "five-oceans-cart-v1";

const slug = new URLSearchParams(
  window.location.search
).get("slug");

const content =
  document.getElementById("content");

/* ОБЩИЕ ФУНКЦИИ */

function el(tag, className, text) {
  const node = document.createElement(tag);

  if (className) node.className = className;

  if (text !== undefined) {
    node.textContent = text;
  }

  return node;
}

function formatPrice(price) {
  if (
    price === null ||
    price === undefined ||
    price === ""
  ) {
    return "Цена уточняется";
  }

  return new Intl.NumberFormat("ru-RU", {
    style: "currency",
    currency: "RUB",
    maximumFractionDigits: 0
  }).format(Number(price));
}

/* ЧТЕНИЕ СОХРАНЁННОЙ КОРЗИНЫ */

function readCart() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(CART_KEY) || "[]"
    );

    return Array.isArray(saved) ? saved : [];

  } catch (error) {
    console.error("Ошибка чтения корзины:", error);
    return [];
  }
}

/* ПОЛУЧЕНИЕ КОЛИЧЕСТВА */

function validQuantity(value) {
  const n = Number(value);

  if (!Number.isInteger(n) || n < 1) {
    return 0;
  }

  return Math.min(n, 99);
}

/* ЗАГРУЗКА ТОВАРА */

async function loadProduct() {

  try {

    const response = await fetch(
      "/data/products.json",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Ошибка загрузки");
    }

    const products = await response.json();

    if (!Array.isArray(products)) {
      throw new Error("Неверный формат каталога");
    }

    const product = products.find(p =>
      p.slug === slug
    );

    if (!product) {
      content.textContent = "Товар не найден.";
      return;
    }

    document.title =
      product.title + " — 5 океанов";

    content.replaceChildren();

    const layout = el("div", "product");
    const gallery = el("div");
    const details = el("div");

    /* ФОТОГРАФИИ */

    const photos = Array.isArray(product.photos)
      ? product.photos.filter(Boolean)
      : [];

    if (photos.length) {

      const mainImage =
        document.createElement("img");

      mainImage.className = "main-photo";
      mainImage.src = photos[0];
      mainImage.alt = product.title;

      gallery.appendChild(mainImage);

      const thumbnails =
        el("div", "thumbnails");

      photos.forEach((photo, index) => {

        const button =
          document.createElement("button");

        button.type = "button";

        if (index === 0) {
          button.classList.add("active");
        }

        const img =
          document.createElement("img");

        img.src = photo;
        img.alt = "Фото " + (index + 1);

        button.appendChild(img);

        button.addEventListener("click", () => {

          mainImage.src = photo;

          thumbnails.querySelectorAll("button")
            .forEach(b =>
              b.classList.remove("active")
            );

          button.classList.add("active");
        });

        thumbnails.appendChild(button);

      });

      gallery.appendChild(thumbnails);

    } else {

      gallery.appendChild(
        el("p", "", "Фотография пока отсутствует")
      );
    }

    /* НАЗВАНИЕ И ОПИСАНИЕ */

    details.appendChild(
      el("h1", "", product.title)
    );

    if (product.description) {
      details.appendChild(
        el("p", "description", product.description)
      );
    }

    details.appendChild(
      el("div", "price", formatPrice(product.price))
    );

    const available =
      product.available === true;

    details.appendChild(
      el(
        "p",
        available ? "status" : "status off",
        available ? "В наличии" : "Нет в наличии"
      )
    );

    /* РАЗМЕРЫ */

    const sizes = Array.isArray(product.sizes)
      ? product.sizes.filter(Boolean).map(String)
      : [];

    let selectedSize = null;

    /*
      Блок уже выбранных товаров.
      Он будет обновляться по localStorage.
    */

    const cartState =
      el("div", "cart-state");

    cartState.hidden = true;

    const cartStateTitle =
      el("div", "cart-state-title");

    const cartStateItems =
      el("div", "cart-state-items");

    const cartStateLink = el(
      "a",
      "cart-state-link",
      "Посмотреть корзину →"
    );

    cartStateLink.href = "/cart.html";

    cartState.appendChild(cartStateTitle);
    cartState.appendChild(cartStateItems);
    cartState.appendChild(cartStateLink);

    details.appendChild(cartState);

    /*
      Создаём кнопки выбора размера.
    */

    const sizeButtonMap = new Map();

    if (sizes.length) {

      details.appendChild(
        el("h3", "", "Выберите размер")
      );

      const sizeButtons =
        el("div", "sizes");

      sizes.forEach(size => {

        const button =
          el("button", "size", size);

        button.type = "button";
        button.disabled = !available;

        button.addEventListener("click", () => {

          selectedSize = size;

          sizeButtons.querySelectorAll("button")
            .forEach(b =>
              b.classList.remove("selected")
            );

          button.classList.add("selected");

        });

        sizeButtonMap.set(size, button);

        sizeButtons.appendChild(button);
      });

      details.appendChild(sizeButtons);
    }

    /* КОЛИЧЕСТВО */

    const quantityTitle =
      el("h3", "", "Количество");

    details.appendChild(quantityTitle);

    const quantity =
      document.createElement("input");

    quantity.type = "number";
    quantity.min = "1";
    quantity.max = "99";
    quantity.step = "1";
    quantity.value = "1";
    quantity.className = "quantity";
    quantity.disabled = !available;

    details.appendChild(quantity);

    /* КНОПКА ДОБАВЛЕНИЯ */

    const addButton = el(
      "button",
      "add-cart",
      "Добавить в корзину"
    );

    addButton.type = "button";
    addButton.disabled = !available;

    details.appendChild(addButton);

    const message = el("p", "message");
    message.setAttribute(
      "aria-live",
      "polite"
    );

    details.appendChild(message);

    /* КНОПКИ ПЕРЕХОДА */

    const actions =
      el("div", "cart-actions");

    actions.hidden = true;

    const cartLink = el(
      "a",
      "action-button action-primary",
      "Перейти в корзину →"
    );

    cartLink.href = "/cart.html";

    const continueLink = el(
      "a",
      "action-button action-secondary",
      "Продолжить покупки"
    );

    continueLink.href = "/";

    actions.appendChild(cartLink);
    actions.appendChild(continueLink);

    details.appendChild(actions);

    /*
      Находим категорию для возврата
      к покупкам.
    */

    fetch("/data/categories.json", {
      cache: "no-store"
    })
    .then(r => r.ok ? r.json() : [])
    .then(categories => {

      if (!Array.isArray(categories)) return;

      const category = categories.find(c =>
        String(c.id).trim().toLowerCase() ===
        String(product.category).trim().toLowerCase()
      );

      if (category && category.slug) {

        continueLink.href =
          "/category.html?slug=" +
          encodeURIComponent(category.slug);
      }

    })
    .catch(() => {});

    /* =====================================
       ОТОБРАЖЕНИЕ УЖЕ ДОБАВЛЕННОГО ТОВАРА
    ===================================== */

    function updateProductCartState() {

      const savedCart = readCart();

      const ownItems = savedCart.filter(item =>
        item.slug === product.slug &&
        validQuantity(item.quantity) > 0
      );

      const totalCount = ownItems.reduce(
        (sum, item) =>
          sum + validQuantity(item.quantity),
        0
      );

      cartState.hidden = totalCount === 0;

      cartStateItems.replaceChildren();

      if (totalCount === 0) {

        addButton.textContent =
          "Добавить в корзину";

        quantityTitle.textContent =
          "Количество";

      } else {

        cartStateTitle.textContent =
          "✓ Уже в корзине: " +
          totalCount + " шт.";

        addButton.textContent =
          "Добавить ещё в корзину";

        quantityTitle.textContent =
          "Сколько добавить ещё";

        /*
          Показываем количество по каждому
          размеру или общий объём, если
          у товара нет размеров.
        */

        ownItems.forEach(item => {

          const label = item.size
            ? "Размер " + item.size
            : "Без размера";

          cartStateItems.appendChild(
            el(
              "div",
              "",
              label + " — " +
              validQuantity(item.quantity) +
              " шт."
            )
          );
        });

      }

      /*
        Обновляем надписи на кнопках размеров.
      */

      sizeButtonMap.forEach((button, size) => {

        const count = ownItems
          .filter(item => String(item.size) === size)
          .reduce(
            (sum, item) =>
              sum + validQuantity(item.quantity),
            0
          );

        button.textContent = count > 0
          ? size + " · в корзине " + count
          : size;
      });

      /*
        Если пользователь ещё не выбрал размер,
        а он уже есть в корзине,
        восстанавливаем последний добавленный
        размер, который доступен.
      */

      if (sizes.length && !selectedSize) {

        const lastSaved = [...ownItems]
          .reverse()
          .find(item =>
            sizes.includes(String(item.size))
          );

        if (lastSaved) {

          selectedSize =
            String(lastSaved.size);

          const savedButton =
            sizeButtonMap.get(selectedSize);

          if (savedButton) {
            savedButton.classList.add("selected");
          }
        }
      }

    }

    /* =====================================
       ДОБАВЛЕНИЕ В КОРЗИНУ
    ===================================== */

    addButton.addEventListener("click", () => {

      message.textContent = "";
      message.className = "message";
      actions.hidden = true;

      if (sizes.length && !selectedSize) {

        message.classList.add("error");

        message.textContent =
          "Сначала выберите размер.";

        return;
      }

      const count = Number(quantity.value);

      if (
        !Number.isInteger(count) ||
        count < 1 ||
        count > 99
      ) {

        message.classList.add("error");

        message.textContent =
          "Укажите количество от 1 до 99.";

        return;
      }

      try {

        const cart = readCart();

        const existing = cart.find(item =>
          item.slug === product.slug &&
          item.size === selectedSize
        );

        if (existing) {

          const previousCount =
            validQuantity(existing.quantity);

          if (previousCount + count > 99) {

            message.classList.add("error");

            message.textContent =
              "Для одного размера можно " +
              "добавить максимум 99 шт.";

            return;
          }

          existing.quantity =
            previousCount + count;

        } else {

          cart.push({
            slug: product.slug,
            size: selectedSize,
            quantity: count
          });
        }

        localStorage.setItem(
          CART_KEY,
          JSON.stringify(cart)
        );

        /*
          Обновляем всю информацию
          непосредственно на этой странице.
        */

        updateProductCartState();

        /*
          Обновляем верхний счётчик корзины.
        */

        window.dispatchEvent(
          new Event("five-oceans-cart-updated")
        );

        message.classList.add("success");

        message.textContent =
          "✓ Товар добавлен в корзину!";

        actions.hidden = false;

      } catch (error) {

        console.error(error);

        message.classList.add("error");

        message.textContent =
          "Не удалось сохранить корзину.";
      }
    });

    /* СОХРАНЕНИЕ СОСТОЯНИЯ МЕЖДУ ПЕРЕХОДАМИ */

    window.addEventListener(
      "pageshow",
      updateProductCartState
    );

    window.addEventListener("storage", event => {

      if (
        event.key === CART_KEY ||
        event.key === null
      ) {
        updateProductCartState();
      }

    });

    /* ПЕРВОНАЧАЛЬНАЯ ПРОВЕРКА КОРЗИНЫ */

    updateProductCartState();

    /* СОБИРАЕМ СТРАНИЦУ */

    layout.appendChild(gallery);
    layout.appendChild(details);
    content.appendChild(layout);

  } catch (error) {

    console.error(error);

    content.textContent =
      "Не удалось загрузить информацию о товаре.";
  }
}

loadProduct();

</script>

<!-- ОБЩАЯ КОРЗИНА -->

<script src="/cart-nav.js" defer></script>

</body>
</html>

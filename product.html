
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Товар — Клуб «5 океанов»</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fa;
  color: #14283a;
  font-family: Arial, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ВЕРХНЕЕ МЕНЮ */

header {
  background: #102c43;
  color: white;
  padding: 22px 3%;
}

header nav {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.brand {
  font-size: 21px;
  font-weight: bold;
  white-space: nowrap;
}

.menu {
  display: flex;
  align-items: center;
  gap: 24px;
  font-size: 14px;
}

.menu a {
  color: white;
  font-weight: 400;
  white-space: nowrap;
}

header nav .menu .global-cart-link {
  margin-left: 0;
}

/* КАРТОЧКА ТОВАРА */

main {
  max-width: 1150px;
  margin: 35px auto;
  padding: 20px;
}

.product {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
}

/* ФОТОГРАФИИ */

.main-photo {
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  background: white;
  border-radius: 12px;
}

.thumbnails {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.thumbnails button {
  padding: 0;
  border: 2px solid transparent;
  border-radius: 8px;
  background: white;
  cursor: pointer;
}

.thumbnails button.active {
  border-color: #146789;
}

.thumbnails img {
  width: 75px;
  height: 75px;
  object-fit: contain;
}

/* ИНФОРМАЦИЯ О ТОВАРЕ */

h1 {
  font-size: 32px;
  margin-top: 0;
}

.description {
  line-height: 1.7;
  white-space: pre-line;
  color: #526778;
}

.price {
  font-size: 28px;
  font-weight: bold;
  margin: 24px 0;
}

.status {
  color: #28734a;
}

.status.off {
  color: #a03b3b;
}

/* РАЗМЕРЫ */

.sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 12px 0 25px;
}

.size {
  padding: 12px 16px;
  border: 1px solid #cbd5df;
  border-radius: 8px;
  background: white;
  color: #14283a;
  cursor: pointer;
  font-size: 14px;
}

.size.selected {
  background: #102c43;
  color: white;
  border-color: #102c43;
}

.size:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ТОВАРЫ БЕЗ РАЗМЕРА */

.cart-info {
  margin: 15px 0;
  font-size: 14px;
  color: #28734a;
}

.cart-info:empty {
  display: none;
}

/* ВЫБОР КОЛИЧЕСТВА */

.quantity-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  max-width: 350px;
  margin: 22px 0;
}

.quantity-label {
  font-size: 15px;
}

.quantity-control {
  display: inline-flex;
  align-items: center;
  border: 1px solid #cbd5df;
  border-radius: 9px;
  background: white;
  overflow: hidden;
}

.quantity-control button {
  width: 43px;
  height: 43px;
  border: none;
  background: white;
  color: #14283a;
  font-size: 22px;
  cursor: pointer;
}

.quantity-control button:hover:not(:disabled) {
  background: #edf1f5;
}

.quantity-control button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.quantity-number {
  min-width: 38px;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
}

/* ДОБАВЛЕНИЕ В КОРЗИНУ */

.add-cart {
  display: block;
  width: 100%;
  max-width: 350px;
  padding: 16px;
  border: none;
  border-radius: 9px;
  background: #102c43;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.add-cart:hover:not(:disabled) {
  background: #17445f;
}

.add-cart:disabled {
  background: #aab5bd;
  cursor: not-allowed;
}

/* ОШИБКИ */

.message {
  margin-top: 12px;
  font-size: 13px;
  line-height: 1.5;
  color: #a03b3b;
}

.message:empty {
  display: none;
}

/* ПОДВАЛ */

footer {
  text-align: center;
  padding: 40px;
  color: #71808e;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media (max-width: 700px) {
  .product {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  header {
    padding: 18px 14px;
  }

  .brand {
    font-size: 17px;
  }

  .menu {
    gap: 12px;
    font-size: 12px;
  }

  main {
    margin-top: 20px;
  }

  h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<header>
  <nav>
    <a href="/" class="brand">
      5 ОКЕАНОВ
    </a>

    <div class="menu">
      <a href="/">На главную</a>
    </div>
  </nav>
</header>

<main>
  <div id="content">
    Загружаем товар...
  </div>
</main>

<footer>
  Клуб «5 океанов»
</footer>

<script>

/* НАСТРОЙКИ */

const CART_KEY = "five-oceans-cart-v1";

const slug = new URLSearchParams(
  window.location.search
).get("slug");

const content = document.getElementById("content");

/* ОБЩИЕ ФУНКЦИИ */

function el(tag, className, text) {
  const node = document.createElement(tag);

  if (className) {
    node.className = className;
  }

  if (text !== undefined) {
    node.textContent = text;
  }

  return node;
}

function formatPrice(price) {
  if (
    price === null ||
    price === undefined ||
    price === ""
  ) {
    return "Цена уточняется";
  }

  return new Intl.NumberFormat("ru-RU", {
    style: "currency",
    currency: "RUB",
    maximumFractionDigits: 0
  }).format(Number(price));
}

/* ЧИТАЕМ КОРЗИНУ */

function readCart() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(CART_KEY) || "[]"
    );

    return Array.isArray(saved) ? saved : [];

  } catch (error) {
    console.error(error);
    return [];
  }
}

/* ПРОВЕРЯЕМ КОЛИЧЕСТВО */

function validQuantity(value) {
  const number = Number(value);

  if (!Number.isInteger(number) || number < 1) {
    return 0;
  }

  return Math.min(number, 99);
}

/* ЗАГРУЖАЕМ ТОВАР */

async function loadProduct() {

  try {

    const response = await fetch(
      "/data/products.json",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Ошибка загрузки товаров");
    }

    const products = await response.json();

    if (!Array.isArray(products)) {
      throw new Error("Неверный формат данных");
    }

    const product = products.find(p =>
      p.slug === slug
    );

    if (!product) {
      content.textContent = "Товар не найден.";
      return;
    }

    document.title =
      product.title + " — 5 океанов";

    content.replaceChildren();

    const layout = el("div", "product");
    const gallery = el("div");
    const details = el("div");

    /* ФОТОГРАФИИ */

    const photos = Array.isArray(product.photos)
      ? product.photos.filter(Boolean)
      : [];

    if (photos.length) {

      const mainImage = document.createElement("img");

      mainImage.className = "main-photo";
      mainImage.src = photos[0];
      mainImage.alt = product.title;

      gallery.appendChild(mainImage);

      const thumbnails = el("div", "thumbnails");

      photos.forEach((photo, index) => {

        const button = document.createElement("button");
        button.type = "button";

        if (index === 0) {
          button.classList.add("active");
        }

        const img = document.createElement("img");

        img.src = photo;
        img.alt = "Фото " + (index + 1);

        button.appendChild(img);

        button.addEventListener("click", () => {
          mainImage.src = photo;

          thumbnails.querySelectorAll("button")
            .forEach(b =>
              b.classList.remove("active")
            );

          button.classList.add("active");
        });

        thumbnails.appendChild(button);
      });

      gallery.appendChild(thumbnails);

    } else {

      gallery.appendChild(
        el("p", "", "Фотография пока отсутствует")
      );
    }

    /* НАЗВАНИЕ */

    details.appendChild(
      el("h1", "", product.title)
    );

    /* ОПИСАНИЕ */

    if (product.description) {
      details.appendChild(
        el("p", "description", product.description)
      );
    }

    /* ЦЕНА */

    details.appendChild(
      el("div", "price", formatPrice(product.price))
    );

    /* НАЛИЧИЕ */

    const available = product.available === true;

    details.appendChild(
      el(
        "p",
        available ? "status" : "status off",
        available ? "В наличии" : "Нет в наличии"
      )
    );

    /* РАЗМЕРЫ */

    const sizes = Array.isArray(product.sizes)
      ? product.sizes.filter(Boolean).map(String)
      : [];

    let selectedSize = null;

    const sizeButtons = el("div", "sizes");
    const sizeButtonMap = new Map();

    if (sizes.length) {

      details.appendChild(
        el("h3", "", "Размер")
      );

      sizes.forEach(size => {

        const button = el("button", "size", size);
        button.type = "button";
        button.disabled = !available;

        button.addEventListener("click", () => {

          selectedSize = size;

          sizeButtons.querySelectorAll("button")
            .forEach(b =>
              b.classList.remove("selected")
            );

          button.classList.add("selected");
          message.textContent = "";

        });

        sizeButtonMap.set(size, button);
        sizeButtons.appendChild(button);

      });

      details.appendChild(sizeButtons);
    }

    /* КОЛИЧЕСТВО УЖЕ В КОРЗИНЕ */

    const cartInfo = el("p", "cart-info");

    details.appendChild(cartInfo);

    /* УПРАВЛЕНИЕ КОЛИЧЕСТВОМ */

    let quantityValue = 1;

    const quantityRow = el("div", "quantity-row");

    const quantityLabel = el(
      "span",
      "quantity-label",
      "Добавить ещё"
    );

    const quantityControl = el(
      "div",
      "quantity-control"
    );

    const minus = el("button", "", "−");
    minus.type = "button";
    minus.setAttribute(
      "aria-label",
      "Уменьшить количество"
    );

    const quantityNumber = el(
      "span",
      "quantity-number",
      "1"
    );

    const plus = el("button", "", "+");
    plus.type = "button";
    plus.setAttribute(
      "aria-label",
      "Увеличить количество"
    );

    function updateQuantity() {
      quantityNumber.textContent =
        String(quantityValue);

      minus.disabled =
        !available || quantityValue <= 1;

      plus.disabled =
        !available || quantityValue >= 99;
    }

    minus.addEventListener("click", () => {
      if (quantityValue > 1) {
        quantityValue--;
        updateQuantity();
      }
    });

    plus.addEventListener("click", () => {
      if (quantityValue < 99) {
        quantityValue++;
        updateQuantity();
      }
    });

    quantityControl.appendChild(minus);
    quantityControl.appendChild(quantityNumber);
    quantityControl.appendChild(plus);

    quantityRow.appendChild(quantityLabel);
    quantityRow.appendChild(quantityControl);

    details.appendChild(quantityRow);

    updateQuantity();

    /* ОСНОВНАЯ КНОПКА */

    const addButton = el(
      "button",
      "add-cart",
      "Добавить в корзину"
    );

    addButton.type = "button";
    addButton.disabled = !available;

    details.appendChild(addButton);

    /* СООБЩЕНИЕ ОБ ОШИБКЕ */

    const message = el("p", "message");
    message.setAttribute("aria-live", "polite");

    details.appendChild(message);

    /* ОБНОВЛЕНИЕ ИНФОРМАЦИИ О КОРЗИНЕ */

    function updateCartState() {

      const cart = readCart();

      const ownItems = cart.filter(item =>
        item.slug === product.slug &&
        validQuantity(item.quantity) > 0
      );

      const totalCount = ownItems.reduce(
        (sum, item) =>
          sum + validQuantity(item.quantity),
        0
      );

      /* Товары с размерами */

      if (sizes.length) {

        cartInfo.textContent = "";

        sizeButtonMap.forEach((button, size) => {

          const count = ownItems
            .filter(item =>
              String(item.size) === size
            )
            .reduce(
              (sum, item) =>
                sum + validQuantity(item.quantity),
              0
            );

          button.textContent =
            count > 0
              ? size + " (" + count + ")"
              : size;
        });

      } else {

        /* Товары без размеров */

        cartInfo.textContent =
          totalCount > 0
            ? "В корзине: " + totalCount + " шт."
            : "";
      }

    }

    /* ВОССТАНАВЛИВАЕМ ВЫБРАННЫЙ РАЗМЕР */

    function restoreSize() {

      if (!sizes.length || selectedSize) return;

      const ownItems = readCart().filter(item =>
        item.slug === product.slug &&
        sizes.includes(String(item.size)) &&
        validQuantity(item.quantity) > 0
      );

      if (!ownItems.length) return;

      const lastItem = ownItems[ownItems.length - 1];

      selectedSize = String(lastItem.size);

      const button = sizeButtonMap.get(selectedSize);

      if (button) {
        button.classList.add("selected");
      }

    }

    /* КРАТКОЕ ПОДТВЕРЖДЕНИЕ ДОБАВЛЕНИЯ */

    let feedbackTimer = null;

    function showAddedFeedback() {

      if (feedbackTimer !== null) {
        clearTimeout(feedbackTimer);
      }

      addButton.textContent = "✓ Добавлено";

      feedbackTimer = setTimeout(() => {
        addButton.textContent = "Добавить в корзину";
        feedbackTimer = null;
      }, 1500);
    }

    /* ДОБАВЛЕНИЕ В КОРЗИНУ */

    addButton.addEventListener("click", () => {

      message.textContent = "";

      if (sizes.length && !selectedSize) {
        message.textContent =
          "Сначала выберите размер.";
        return;
      }

      const count = quantityValue;

      try {

        const cart = readCart();

        const existing = cart.find(item =>
          item.slug === product.slug &&
          String(item.size ?? "") ===
          String(selectedSize ?? "")
        );

        if (existing) {

          const previousCount =
            validQuantity(existing.quantity);

          if (previousCount + count > 99) {
            message.textContent =
              "Максимум 99 шт. одного размера.";
            return;
          }

          existing.quantity =
            previousCount + count;

        } else {

          cart.push({
            slug: product.slug,
            size: selectedSize,
            quantity: count
          });
        }

        localStorage.setItem(
          CART_KEY,
          JSON.stringify(cart)
        );

        /* Обновляем карточку */

        updateCartState();

        /* Обновляем верхнюю корзину */

        window.dispatchEvent(
          new Event("five-oceans-cart-updated")
        );

        /* Сбрасываем добавляемое количество */

        quantityValue = 1;
        updateQuantity();

        /* Краткое подтверждение */

        showAddedFeedback();

      } catch (error) {

        console.error(error);

        message.textContent =
          "Не удалось сохранить корзину.";
      }

    });

    /* СИНХРОНИЗАЦИЯ */

    window.addEventListener(
      "pageshow",
      updateCartState
    );

    window.addEventListener("storage", event => {
      if (
        event.key === CART_KEY ||
        event.key === null
      ) {
        updateCartState();
      }
    });

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          updateCartState();
        }
      }
    );

    /* ПЕРВОНАЧАЛЬНАЯ ЗАГРУЗКА */

    restoreSize();
    updateCartState();

    /* СОБИРАЕМ КАРТОЧКУ */

    layout.appendChild(gallery);
    layout.appendChild(details);

    content.appendChild(layout);

  } catch (error) {

    console.error(error);

    content.textContent =
      "Не удалось загрузить информацию о товаре.";
  }
}

loadProduct();

</script>

<!-- ЕДИНАЯ КОРЗИНА -->

<script src="/cart-nav.js" defer></script>

</body>
</html>


<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Товар — Клуб «5 океанов»</title>

<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: #f5f7fa;
  color: #14283a;
  font-family: Arial, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ШАПКА */

header {
  background: #102c43;
  color: white;
  padding: 22px 3%;
}

header nav {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.brand {
  font-size: 21px;
  font-weight: bold;
  white-space: nowrap;
}

.menu {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 24px;
  font-size: 14px;
}

.menu a {
  color: white;
  font-size: inherit;
  font-weight: 400;
  white-space: nowrap;
}

header nav .menu .global-cart-link {
  margin-left: 0;
}

/* КАРТОЧКА */

main {
  max-width: 1150px;
  margin: 35px auto;
  padding: 20px;
}

.product {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
}

/* ФОТО */

.main-photo {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  background: white;
  border-radius: 12px;
}

.thumbnails {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.thumbnails button {
  padding: 0;
  border: 2px solid transparent;
  border-radius: 8px;
  background: white;
  cursor: pointer;
}

.thumbnails button.active {
  border-color: #146789;
}

.thumbnails img {
  width: 75px;
  height: 75px;
  object-fit: contain;
  display: block;
}

.no-photo {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  padding: 20px;
  border-radius: 12px;
  background: #e8f0f5;
  color: #71808e;
  text-align: center;
}

/* ИНФОРМАЦИЯ */

h1 {
  margin: 0 0 18px;
  font-size: 32px;
}

.description {
  color: #526778;
  white-space: pre-line;
  line-height: 1.7;
}

.price {
  margin: 24px 0;
  font-size: 28px;
  font-weight: bold;
}

.status {
  margin: 16px 0 26px;
  color: #28734a;
}

.status.off {
  color: #a03b3b;
}

/* РАЗМЕРЫ */

.size-heading {
  margin: 0 0 12px;
  font-size: 16px;
}

.sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 30px;
}

.size {
  padding: 12px 17px;
  border: 1px solid #cbd5df;
  border-radius: 8px;
  background: white;
  color: #14283a;
  font-size: 15px;
  cursor: pointer;
}

.size.selected {
  background: #102c43;
  color: white;
  border-color: #102c43;
}

.size:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* ПОКУПКА */

.purchase {
  max-width: 410px;
}

.purchase-label {
  margin: 0 0 12px;
  color: #146789;
  font-size: 15px;
  font-weight: bold;
}

.purchase-line {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* СЧЁТЧИК */

.stepper {
  display: inline-flex;
  flex-shrink: 0;
  align-items: center;
  overflow: hidden;
  border: 1px solid #b9cdd8;
  border-radius: 9px;
  background: white;
}

.stepper button {
  width: 43px;
  height: 47px;
  padding: 0;
  border: 0;
  background: transparent;
  color: #146789;
  font-size: 23px;
  cursor: pointer;
}

.stepper button:hover:not(:disabled) {
  background: #e8f0f5;
}

.stepper button:disabled {
  opacity: .3;
  cursor: not-allowed;
}

.stepper-value {
  min-width: 40px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

/* СИНЯЯ КНОПКА */

.add-button {
  flex: 1;
  min-height: 49px;
  border: none;
  border-radius: 9px;
  background: #146789;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.add-button:hover:not(:disabled) {
  background: #10516d;
}

.add-button:disabled {
  background: #aab5bd;
  cursor: not-allowed;
}

/* ЗЕЛЁНОЕ СОСТОЯНИЕ */

.purchase.in-cart .purchase-label {
  color: #28734a;
}

.purchase.in-cart .purchase-line {
  display: inline-flex;
  padding: 8px;
  border: 1px solid #b9dec5;
  border-radius: 12px;
  background: #eaf7ee;
}

.purchase.in-cart .stepper {
  border-color: #79b891;
}

.purchase.in-cart .stepper button {
  color: #28734a;
}

.purchase.in-cart .stepper button:hover:not(:disabled) {
  background: #e0f2e5;
}

/* ПРОДОЛЖИТЬ ПОКУПКИ */

.continue-link {
  display: flex;
  width: 100%;
  max-width: 410px;
  min-height: 47px;
  margin-top: 20px;
  padding: 12px 18px;
  align-items: center;
  justify-content: center;
  border: 1px solid #cbd5df;
  border-radius: 9px;
  background: white;
  color: #102c43;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
}

.continue-link:hover {
  background: #e8f0f5;
}

/* СООБЩЕНИЯ */

.message {
  margin-top: 12px;
  color: #a03b3b;
  font-size: 13px;
  line-height: 1.5;
}

.message:empty {
  display: none;
}

footer {
  padding: 40px 20px;
  text-align: center;
  color: #71808e;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media (max-width: 700px) {
  .product {
    grid-template-columns: 1fr;
    gap: 22px;
  }

  header {
    padding: 18px 14px;
  }

  .brand {
    font-size: 17px;
  }

  .menu {
    gap: 12px;
    font-size: 12px;
  }

  main {
    margin: 20px auto;
  }

  h1 {
    font-size: 27px;
  }

  .purchase,
  .continue-link {
    max-width: 100%;
  }
}

@media (max-width: 360px) {
  .stepper button { width: 36px; }
  .stepper-value { min-width: 29px; }
  .add-button { font-size: 13px; }
}
</style>
<link rel="stylesheet" href="/site-theme.css">
</head>

<body>

<header>
  <nav>
    <a href="/" class="brand">5 ОКЕАНОВ</a>
    <div class="menu">
      <a href="/">На главную</a>
    </div>
  </nav>
</header>

<main>
  <nav class="page-back-nav" aria-label="Вернуться к товарам">
    <a id="back-to-category" class="quiet-back" href="/#catalog">
      ← К категориям
    </a>
  </nav>
  <div id="content">Загружаем товар...</div>
</main>

<footer>Клуб «5 океанов»</footer>

<script>

/* НАСТРОЙКИ */

const CART_KEY = "five-oceans-cart-v1";

const productSlug = new URLSearchParams(
  location.search
).get("slug");

const content = document.getElementById("content");

/* ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ */

function makeElement(tag, className, text) {
  const node = document.createElement(tag);

  if (className) node.className = className;

  if (text !== undefined) {
    node.textContent = text;
  }

  return node;
}

function formatPrice(value) {
  if (
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(Number(value))
  ) {
    return "Цена уточняется";
  }

  return new Intl.NumberFormat("ru-RU", {
    style: "currency",
    currency: "RUB",
    maximumFractionDigits: 0
  }).format(Number(value));
}

function normalizeSize(value) {
  return String(value ?? "").trim();
}

function validQuantity(value) {
  const n = Number(value);

  return Number.isInteger(n) && n > 0
    ? n
    : 0;
}

/* КОРЗИНА */

function readCart() {
  const raw = localStorage.getItem(CART_KEY);

  if (!raw) return [];

  const cart = JSON.parse(raw);

  if (!Array.isArray(cart)) {
    throw new Error("Неверный формат корзины");
  }

  return cart;
}

function safelyReadCart() {
  try {
    return readCart();
  } catch (error) {
    console.error(error);
    return [];
  }
}

function isSameItem(item, slug, size) {
  return (
    item &&
    item.slug === slug &&
    normalizeSize(item.size) === normalizeSize(size)
  );
}

function cartQuantity(cart, slug, size) {
  return cart
    .filter(item => isSameItem(item, slug, size))
    .reduce(
      (sum, item) =>
        sum + validQuantity(item.quantity),
      0
    );
}

function setItemQuantity(cart, slug, size, quantity) {
  const result = [];
  let updated = false;

  for (const item of cart) {

    if (isSameItem(item, slug, size)) {

      if (!updated && quantity > 0) {
        result.push({
          ...item,
          slug,
          size,
          quantity
        });

        updated = true;
      }

    } else {
      result.push(item);
    }
  }

  if (!updated && quantity > 0) {
    result.push({
      slug,
      size,
      quantity
    });
  }

  return result;
}

function saveCart(cart) {
  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  window.dispatchEvent(
    new Event("five-oceans-cart-updated")
  );
}

/* ПРОВЕРКА СКЛАДА В CLOUDFLARE D1 */

/*
  Ответ функции:
  {
    tracked: true,
    available: true
  }

  Если tracked: false — товар ещё
  не внесён в складскую базу.
*/

async function checkStock(slug, size, quantity) {

  const params = new URLSearchParams({
    slug: slug,
    size: normalizeSize(size),
    quantity: String(quantity)
  });

  const response = await fetch(
    "/api/stock-check?" + params.toString(),
    { cache: "no-store" }
  );

  if (!response.ok) {
    throw new Error(
      "Ошибка проверки склада: " + response.status
    );
  }

  const data = await response.json();

  if (
    !data ||
    typeof data.tracked !== "boolean" ||
    typeof data.available !== "boolean"
  ) {
    throw new Error("Неверный ответ склада");
  }

  return data;
}

function variantStockSize(variant,size) {
  const simple = String(size ?? "").trim();
  return variant ? "v:" + variant.code + "|" + simple : simple;
}
function normalizedSizes(list) {
  return Array.isArray(list) ? [...new Set(list.map(v=>String(v??"").trim()).filter(Boolean))] : [];
}
function productVariants(product) {
  if (!Array.isArray(product.variants)) return [];
  const found = new Set();
  return product.variants.filter(v => {
    if (!v || typeof v.code !== "string" ||
        !/^[a-z0-9][a-z0-9-]{0,24}$/.test(v.code) ||
        !/^#[0-9a-fA-F]{6}$/.test(v.hex || "") ||
        found.has(v.code)) return false;
    found.add(v.code);
    return true;
  });
}
function availableSizes(product, variant) {
  const own = normalizedSizes(variant?.sizes);
  const main = normalizedSizes(product.sizes);
  return own.length ? own : main;
}

/* ЗАГРУЗКА ТОВАРА */

async function loadProduct() {

  try {

    const response = await fetch(
      "/data/products.json",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Ошибка загрузки товаров");
    }

    const products = await response.json();

    if (!Array.isArray(products)) {
      throw new Error("Неверный формат каталога");
    }

    const product = products.find(
      p => p.slug === productSlug
    );

    if (!product) {
      content.textContent = "Товар не найден.";
      return;
    }

    document.title =
      product.title + " — Клуб «5 океанов»";

    /*
      Категорию ищем в актуальном Pages CMS.
      Эта навигация никак не влияет на загрузку карточки и корзину.
      Если данные категории недоступны, ссылка «К категориям»
      остаётся рабочей.
    */
    const backToCategory = document.getElementById("back-to-category");
    fetch("/data/categories.json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error("Категории недоступны");
        return response.json();
      })
      .then(categories => {
        if (!Array.isArray(categories)) return;
        const category = categories.find(
          entry => entry && entry.id === product.category
        );
        if (!category || !category.slug) return;
        backToCategory.href = "/category.html?slug=" +
          encodeURIComponent(category.slug);
        backToCategory.textContent = "← " + category.title;
        backToCategory.setAttribute(
          "aria-label", "Вернуться в категорию «" + category.title + "»"
        );
      })
      .catch(() => {
        // Ссылка на общий каталог остаётся доступной.
      });

    content.replaceChildren();

    const layout = makeElement("div", "product");
    const gallery = makeElement("div");
    const details = makeElement("div");

    const variants = productVariants(product);
    let selectedVariant = variants.find(v=>v.available === true) || variants[0] || null;
    let available = product.available === true &&
      (!variants.length || selectedVariant.available === true);

    // Фотографии выбранного цвета. Если у цвета их пока нет, берём общие.
    function renderGallery() {
      gallery.replaceChildren();
      const own = Array.isArray(selectedVariant?.photos)
        ? selectedVariant.photos.filter(Boolean) : [];
      const defaultPhotos = Array.isArray(product.photos)
        ? product.photos.filter(Boolean) : [];
      const photos = own.length ? own : defaultPhotos;
      if (!photos.length) {
        gallery.appendChild(makeElement("div","no-photo","Фотография пока отсутствует"));
        return;
      }
      const mainPhoto = document.createElement("img");
      mainPhoto.className = "main-photo";
      mainPhoto.src = photos[0];
      mainPhoto.alt = product.title;
      gallery.appendChild(mainPhoto);
      if (photos.length > 1) {
        const thumbnails = makeElement("div","thumbnails");
        photos.forEach((photo,index) => {
          const button = document.createElement("button");
          button.type = "button";
          if(index===0) button.classList.add("active");
          const img = document.createElement("img");
          img.src=photo;img.alt="Фото "+(index+1);
          button.appendChild(img);
          button.addEventListener("click",()=>{
            mainPhoto.src=photo;
            thumbnails.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
            button.classList.add("active");
          });
          thumbnails.appendChild(button);
        });
        gallery.appendChild(thumbnails);
      }
    }
    renderGallery();

    /* НАЗВАНИЕ И ОПИСАНИЕ */

    details.appendChild(
      makeElement("h1", "", product.title)
    );

    if (product.description) {
      details.appendChild(
        makeElement(
          "p",
          "description",
          product.description
        )
      );
    }

    details.appendChild(
      makeElement(
        "div",
        "price",
        formatPrice(product.price)
      )
    );

    /* НАЛИЧИЕ */

    const status = makeElement(
      "p",
      available ? "status" : "status off",
      available ? "В наличии" : "Нет в наличии"
    );

    details.appendChild(status);

    /* Кружки без текстовых подписей. Названия — в aria-label и подсказках. */
    if (variants.length) {
      const row = makeElement("div","color-swatches");
      row.setAttribute("role","group");
      row.setAttribute("aria-label","Выбор цвета");
      const buttons = new Map();

      function updateColorButtons() {
        buttons.forEach((button,code)=>{
          const selected = selectedVariant?.code === code;
          button.classList.toggle("selected",selected);
          button.setAttribute("aria-pressed",String(selected));
        });
      }

      for (const variant of variants) {
        const button = document.createElement("button");
        button.type="button";
        button.className="color-swatch";
        button.style.setProperty("--swatch-color", variant.hex);
        button.setAttribute("aria-label",variant.label || variant.code);
        button.title = (variant.label || variant.code) +
          (variant.available === true ? "" : " — нет в наличии");
        if (variant.available !== true) button.classList.add("unavailable");
        button.addEventListener("click",()=>{
          if (busy) return;
          selectedVariant = variant;
          available = product.available === true && variant.available === true;
          sizes = availableSizes(product,variant);
          selectedSize = sizes[0] || null;
          pendingQuantity = 1;
          message.textContent = "";
          renderGallery();
          buildSizeButtons();
          updateColorButtons();
          renderPurchase();
          refreshStockState();
        });
        buttons.set(variant.code,button);
        row.appendChild(button);
      }

      updateColorButtons();
      details.appendChild(row);
    }

    /* РАЗМЕРЫ */

    let sizes = availableSizes(product,selectedVariant);
    const savedCart = safelyReadCart();
    let selectedSize = sizes[0] || null;
    if (sizes.length) {
      const previous = [...savedCart].reverse().find(item =>
        item.slug === product.slug && validQuantity(item.quantity) > 0 &&
        sizes.some(size => item.size === variantStockSize(selectedVariant,size))
      );
      if (previous) {
        selectedSize = sizes.find(size=>
          variantStockSize(selectedVariant,size) === previous.size
        ) || sizes[0];
      }
    }

    let pendingQuantity = 1;

    const sizeButtons = new Map();

    /* СОСТОЯНИЕ ПРОВЕРКИ СКЛАДА */

    let stockState = "checking";

    /*
      checking    — проверяем
      available   — есть на складе
      unavailable — нет на складе
      untracked   — товар ещё не учтён
      error       — ошибка проверки
    */

    let stockRequestId = 0;
    let busy = false;

    const sizeHeading = makeElement("h3","size-heading","Размер");
    const sizesRow = makeElement("div","sizes");
    details.append(sizeHeading,sizesRow);

    function buildSizeButtons() {
      sizeButtons.clear();
      sizesRow.replaceChildren();
      sizeHeading.hidden = !sizes.length;
      sizesRow.hidden = !sizes.length;
      sizes.forEach(size => {
        const button = makeElement("button","size",size);
        button.type="button";
        button.disabled = !available;
        button.addEventListener("click",()=>{
          if (busy) return;
          selectedSize = size;
          pendingQuantity = 1;
          message.textContent = "";
          renderSizes();
          renderPurchase();
          refreshStockState();
        });
        sizeButtons.set(size,button);
        sizesRow.appendChild(button);
      });
    }
    buildSizeButtons();

    function renderSizes() {
      sizeButtons.forEach((button, size) => {
        const selected = size === selectedSize;

        button.classList.toggle(
          "selected",
          selected
        );

        button.setAttribute(
          "aria-pressed",
          String(selected)
        );

        button.disabled = !available || busy;
      });
    }

    /* БЛОК ПОКУПКИ */

    const purchase = makeElement(
      "div",
      "purchase"
    );

    const purchaseLabel = makeElement(
      "p",
      "purchase-label"
    );

    const purchaseLine = makeElement(
      "div",
      "purchase-line"
    );

    const stepper = makeElement(
      "div",
      "stepper"
    );

    const minusButton = makeElement(
      "button",
      "",
      "−"
    );

    minusButton.type = "button";
    minusButton.setAttribute(
      "aria-label",
      "Уменьшить количество"
    );

    const quantityDisplay = makeElement(
      "span",
      "stepper-value",
      "1"
    );

    quantityDisplay.setAttribute(
      "aria-live",
      "polite"
    );

    const plusButton = makeElement(
      "button",
      "",
      "+"
    );

    plusButton.type = "button";
    plusButton.setAttribute(
      "aria-label",
      "Увеличить количество"
    );

    stepper.append(
      minusButton,
      quantityDisplay,
      plusButton
    );

    const addButton = makeElement(
      "button",
      "add-button",
      "Добавить в корзину"
    );

    addButton.type = "button";

    purchaseLine.append(
      stepper,
      addButton
    );

    purchase.append(
      purchaseLabel,
      purchaseLine
    );

    details.appendChild(purchase);

    /* ПРОДОЛЖИТЬ ПОКУПКИ */

    const continueLink = makeElement(
      "a",
      "continue-link",
      "← Продолжить покупки"
    );

    continueLink.href = "/";
    continueLink.hidden = true;

    details.appendChild(continueLink);

    fetch("/data/categories.json", {
      cache: "no-store"
    })
    .then(r => r.ok ? r.json() : [])
    .then(categories => {

      if (!Array.isArray(categories)) return;

      const category = categories.find(c =>
        String(c.id ?? "").trim().toLowerCase() ===
        String(product.category ?? "").trim().toLowerCase()
      );

      if (category?.slug) {
        continueLink.href =
          "/category.html?slug=" +
          encodeURIComponent(category.slug);
      }

    })
    .catch(error => {
      console.warn("Ошибка загрузки категории", error);
    });

    /* ОШИБКИ */

    const message = makeElement(
      "p",
      "message"
    );

    message.setAttribute(
      "aria-live",
      "polite"
    );

    details.appendChild(message);

    function currentCartQuantity() {
      return cartQuantity(
        safelyReadCart(),
        product.slug,
        selectedSize
      );
    }

    /* ПОКАЗЫВАЕМ РЕЖИМ КАРТОЧКИ */

    function renderPurchase() {

      const count = currentCartQuantity();
      const inCart = count > 0;

      purchase.classList.toggle(
        "in-cart",
        inCart
      );

      continueLink.hidden = !inCart;

      if (!available) {
        status.textContent = "Нет в наличии";
        status.classList.add("off");

      } else if (stockState === "checking") {
        status.textContent = "Проверяем наличие...";
        status.classList.remove("off");

      } else if (stockState === "unavailable") {
        status.textContent = "Нет на складе";
        status.classList.add("off");

      } else if (stockState === "error") {
        status.textContent = "Наличие уточняется";
        status.classList.remove("off");

      } else {
        status.textContent = "В наличии";
        status.classList.remove("off");
      }

      const canIncrease =
        available &&
        !busy &&
        stockState !== "checking" &&
        stockState !== "error" &&
        stockState !== "unavailable";

      if (inCart) {

        /* ЗЕЛЁНЫЙ РЕЖИМ */

        purchaseLabel.textContent =
          "✓ В корзине";

        quantityDisplay.textContent =
          String(count);

        addButton.hidden = true;

        /*
          Уменьшать корзину можно даже
          если товар перестал быть доступен.
        */

        minusButton.disabled = busy;

        plusButton.disabled =
          !canIncrease || count >= 99;

      } else {

        /* СИНИЙ РЕЖИМ */

        purchaseLabel.textContent =
          "Добавить в корзину";

        quantityDisplay.textContent =
          String(pendingQuantity);

        addButton.hidden = false;

        addButton.disabled = !canIncrease;

        minusButton.disabled =
          busy ||
          !available ||
          pendingQuantity <= 1;

        plusButton.disabled =
          !canIncrease ||
          pendingQuantity >= 99;
      }

      renderSizes();
    }

    /* ОБНОВЛЯЕМ НАЛИЧИЕ ПО ВЫБРАННОМУ РАЗМЕРУ */

    async function refreshStockState() {

      const requestId = ++stockRequestId;
      const size = selectedSize;

      if (!available) {
        stockState = "unavailable";
        renderPurchase();
        return;
      }

      stockState = "checking";
      renderPurchase();

      try {

        const result = await checkStock(
          product.slug,
          size,
          1
        );

        if (
          requestId !== stockRequestId ||
          size !== selectedSize
        ) {
          return;
        }

        if (!result.tracked) {
          stockState = "untracked";
        } else {
          stockState = result.available
            ? "available"
            : "unavailable";
        }

      } catch (error) {

        if (requestId !== stockRequestId) {
          return;
        }

        console.error(error);
        stockState = "error";

      } finally {

        if (requestId === stockRequestId) {
          renderPurchase();
        }
      }
    }

    /*
      Перед увеличением количества
      обязательно проверяем склад.

      Для ещё не учтённых товаров
      сохраняем прежнее поведение.
    */

    async function isQuantityAllowed(quantity, size) {

      if (stockState === "untracked") {
        return true;
      }

      const result = await checkStock(
        product.slug,
        size,
        quantity
      );

      return !result.tracked || result.available;
    }

    /*
      Меняем корзину после проверки D1.
    */

    async function setCheckedQuantity(newQuantity) {

      if (busy) return;

      const size = selectedSize;

      if (
        newQuantity < 0 ||
        newQuantity > 99
      ) {
        return;
      }

      busy = true;
      message.textContent = "";
      renderPurchase();

      try {

        /*
          Уменьшение количества разрешено.
          Увеличение — только после проверки.
        */

        const oldQuantity = currentCartQuantity();

        if (newQuantity > oldQuantity) {

          const allowed = await isQuantityAllowed(
            newQuantity,
            size
          );

          if (!allowed) {
            message.textContent =
              "На складе недостаточно товара.";
            return;
          }
        }

        const cart = readCart();

        const newCart = setItemQuantity(
          cart,
          product.slug,
          size,
          newQuantity
        );

        saveCart(newCart);

        if (newQuantity === 0) {
          pendingQuantity = 1;
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Не удалось проверить склад. Попробуйте ещё раз.";

      } finally {

        busy = false;
        renderPurchase();
      }
    }

    /* КНОПКА ПЛЮС */

    plusButton.addEventListener("click", async () => {

      if (busy || !available) return;

      message.textContent = "";

      const count = currentCartQuantity();

      if (count > 0) {

        if (count >= 99) return;

        await setCheckedQuantity(count + 1);

      } else {

        if (pendingQuantity >= 99) return;

        const size = selectedSize;

        busy = true;
        renderPurchase();

        try {

          const nextQuantity = pendingQuantity + 1;

          const allowed = await isQuantityAllowed(
            nextQuantity,
            size
          );

          if (!allowed) {

            message.textContent =
              "На складе недостаточно товара.";

          } else {

            pendingQuantity = nextQuantity;
          }

        } catch (error) {

          console.error(error);

          message.textContent =
            "Не удалось проверить склад. Попробуйте ещё раз.";

        } finally {

          busy = false;
          renderPurchase();
        }
      }
    });

    /* КНОПКА МИНУС */

    minusButton.addEventListener("click", async () => {

      if (busy) return;

      message.textContent = "";

      const count = currentCartQuantity();

      if (count > 0) {

        await setCheckedQuantity(count - 1);

      } else if (pendingQuantity > 1) {

        pendingQuantity--;
        renderPurchase();
      }
    });

    /* ДОБАВИТЬ В КОРЗИНУ */

    addButton.addEventListener("click", async () => {

      if (
        busy ||
        !available ||
        stockState === "checking" ||
        stockState === "error" ||
        stockState === "unavailable"
      ) {
        return;
      }

      const count = currentCartQuantity();

      const newQuantity =
        count + pendingQuantity;

      if (newQuantity > 99) {
        message.textContent =
          "Максимум 99 шт. одного размера.";
        return;
      }

      await setCheckedQuantity(newQuantity);

      /*
        После успешного добавления
        renderPurchase автоматически
        покажет зелёный режим.
      */

      if (currentCartQuantity() > 0) {
        pendingQuantity = 1;
      }
    });

    /* СИНХРОНИЗАЦИЯ */

    window.addEventListener("pageshow", () => {
      renderPurchase();
      refreshStockState();
    });

    window.addEventListener("storage", event => {
      if (
        event.key === CART_KEY ||
        event.key === null
      ) {
        renderPurchase();
      }
    });

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          renderPurchase();
          refreshStockState();
        }
      }
    );

    /* СОБИРАЕМ КАРТОЧКУ */

    layout.append(gallery, details);
    content.appendChild(layout);

    renderSizes();
    refreshStockState();

  } catch (error) {

    console.error(error);

    content.textContent =
      "Не удалось загрузить информацию о товаре.";
  }
}

loadProduct();

</script>

<script src="/site-shell.js"></script>
<script src="/cart-nav.js" defer></script>

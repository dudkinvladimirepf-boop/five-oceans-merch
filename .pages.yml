
media:
  input: media
  output: /media
  rename: safe

content:
  - name: products
    label: Товары
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: title
        label: Название товара
        type: string
        required: true
      - name: description
        label: Описание
        type: text
      - name: price
        label: Цена в рублях
        type: number
      - name: category
        label: Категория
        type: string
      - name: photos
        label: Фотографии
        type: image
        options:
          multiple:
            max: 6
      - name: sizes
        label: Размеры
        type: string
        list: true
      - name: available
        label: В наличии
        type: boolean
        - name: featured
        label: Наш выбор
        type: boolean
      - name: new_arrival
        label: Новинка
        type: boolean

  - name: categories
    label: Категории
    type: file
    path: data/categories.json
    format: json
    list: true
    fields:
      - name: title
        label: Название категории
        type: string
        required: true
      - name: id
        label: Идентификатор категории
        type: string
        required: true
        description: Должен совпадать с категорией товара
      - name: slug
        label: Адрес категории
        type: string
        required: true
        description: Латинскими буквами, без пробелов
      - name: description
        label: Описание категории
        type: text
      - name: image
        label: Фотография категории
        type: image


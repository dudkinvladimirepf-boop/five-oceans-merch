

media:
  input: media
  output: /media
  rename: safe

content:
  - name: products
    label: Товары
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: product_id
        label: Внутренний ID товара
        type: uuid
        required: true
        readonly: true
        description: Постоянный идентификатор. Не изменять.
        options:
          editable: false
          generate: false

      - name: title
        label: Название товара
        type: string
        required: true

      - name: slug
        label: Адрес товара
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9_-]*$"
        description: Уникальный адрес латиницей, без пробелов (например futbolka-okean). Не меняйте его после публикации.

      - name: description
        label: Описание
        type: text

      - name: price
        label: Цена в рублях
        type: number

      - name: category
        label: Категория товара
        type: select
        required: true
        description: Выберите раздел — товар автоматически появится в нём на сайте.
        options:
          placeholder: Выберите категорию
          values:
            - name: футболки
              label: Футболки и лонгсливы
            - name: свитшоты
              label: Толстовки и куртки
            - name: носки
              label: Носки
            - name: головные-уборы
              label: Головные уборы
            - name: аксессуары
              label: Аксессуары и сувениры

      - name: photos
        label: Фотографии
        type: image
        options:
          multiple:
            max: 6

      - name: sizes
        label: Размеры
        type: string
        list: true

      - name: available
        label: В наличии
        type: boolean

      - name: featured
        label: Наш выбор
        type: boolean

      - name: new_arrival
        label: Новинка
        type: boolean

  - name: categories
    label: Категории
    type: file
    path: data/categories.json
    format: json
    list: true
    fields:
      - name: title
        label: Название категории
        type: string
        required: true

      - name: id
        label: Идентификатор категории
        type: string
        required: true
        description: Должен совпадать с категорией товара

      - name: slug
        label: Адрес категории
        type: string
        required: true
        description: Латинскими буквами, без пробелов

      - name: description
        label: Описание категории
        type: text

      - name: image
        label: Фотография категории
        type: image


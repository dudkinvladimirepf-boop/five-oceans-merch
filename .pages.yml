

media:
  input: media
  output: /media
  rename: safe

content:
  - name: products
    label: Товары
    type: file
    path: data/products.json
    format: json
    list: true
    actions:
      - name: finance-import
        label: Передать отмеченные товары в финансовый учёт
        workflow: finance-import.yml
        ref: current
        confirm:
          title: Передать товары в финансовую CRM?
          message: Убедитесь, что вы сохранили новые карточки и включили «Передать в финансовый учёт». Товары не появятся на сайте или складе.
          button: Передать
    fields:
      - name: product_id
        label: Внутренний ID товара
        type: uuid
        required: true
        readonly: true
        description: Постоянный идентификатор. Не изменять.
        options:
          editable: false
          generate: false

      - name: title
        label: Название товара
        type: string
        required: true

      - name: slug
        label: Адрес товара
        type: string
        required: true
        pattern: "^[a-z0-9][a-z0-9_-]*$"
        description: Уникальный адрес латиницей, без пробелов (например futbolka-okean). Не меняйте его после публикации.

      - name: description
        label: Описание
        type: text

      - name: design
        label: Дизайн / надпись (для учёта)
        type: string
        description: Общая вышивка, принт или текст для всех цветов этого товара. Для другой надписи создавайте отдельную карточку — так CRM не смешает остатки разных дизайнов.

      - name: price
        label: Цена в рублях
        type: number

      - name: category
        label: Категория товара
        type: select
        required: true
        description: Выберите раздел — товар автоматически появится в нём на сайте.
        options:
          placeholder: Выберите категорию
          values:
            - name: футболки
              label: Футболки и лонгсливы
            - name: свитшоты
              label: Толстовки и куртки
            - name: носки
              label: Носки
            - name: головные-уборы
              label: Головные уборы
            - name: аксессуары
              label: Аксессуары и сувениры

      - name: published
        label: Опубликовать на сайте (после приёмки)
        type: boolean
        default: false
        description: Новые товары остаются скрытыми. Включайте только после фактического приёма на склад; публикация сама по себе не добавляет остатки.

      - name: finance_enabled
        label: Передать в финансовый учёт
        type: boolean
        default: false
        description: Отметьте товар, сохраните Pages CMS и нажмите «Синхронизировать товары» в финансовой CRM. Закупочные цены и поставщики вводятся только в закрытой CRM.

      - name: variants
        label: Цвета товара (фотографии, размеры и статус)
        type: object
        required: true
        description: Все фотографии, размеры и признаки находятся только внутри своего цвета. Одна общая карточка для одного дизайна во всех его цветах. Для каждой новой надписи создайте отдельный товар.
        list:
          collapsible:
            collapsed: true
            summary: "{label} — {code}"
        fields:
          - name: code
            label: Код цвета
            type: string
            required: true
            pattern: "^[a-z0-9][a-z0-9-]{0,24}$"
            description: Постоянный код латиницей (red, white, black). Не меняйте после синхронизации со складом или оформления заказов.
          - name: label
            label: Название цвета
            type: string
            required: true
            description: Например Красный. Покупатель выбирает цвет кружком; название показывается в корзине и CRM.
          - name: hex
            label: Цвет кружка
            type: string
            required: true
            pattern: "^#[0-9A-Fa-f]{6}$"
            description: HEX-код цвета, например #E30613 для красного или #F5F5F5 для белого.
          - name: photos
            label: Фотографии этого цвета
            type: image
            options:
              multiple:
                max: 6
            description: До 6 фотографий только этого цвета. Первая — обложка в каталоге.
          - name: sizes
            label: Размеры этого цвета
            type: string
            list: true
            description: Каждый размер вписывайте отдельно (например 46-48). Пока размеры не добавлены, складская позиция для цвета не создаётся. Для аксессуара без размеров укажите «Без размера».
          - name: available
            label: В наличии — этот цвет
            type: boolean
            description: Отдельный переключатель для цвета. Для продажи также требуется ненулевой остаток соответствующего цвета и размера в CRM.
          - name: featured
            label: Наш выбор — этот цвет
            type: boolean
            description: Показывать в разделе «Наш выбор» именно этот цвет (если он доступен).
          - name: new_arrival
            label: Новинка — этот цвет
            type: boolean
            description: Показывать в разделе «Новинки» именно этот цвет (если он доступен).

  - name: categories
    label: Категории
    type: file
    path: data/categories.json
    format: json
    list: true
    fields:
      - name: title
        label: Название категории
        type: string
        required: true

      - name: id
        label: Идентификатор категории
        type: string
        required: true
        description: Должен совпадать с категорией товара

      - name: slug
        label: Адрес категории
        type: string
        required: true
        description: Латинскими буквами, без пробелов

      - name: description
        label: Описание категории
        type: text

      - name: image
        label: Фотография категории
        type: image


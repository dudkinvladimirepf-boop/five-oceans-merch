<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Контакты магазина Клуба 5 океанов и ОКЕАН HD">
<title>Контакты — Клуб «5 океанов» × ОКЕАН HD</title>
<style>
body{margin:0}
.contacts-main{
  min-height:65vh; display:flex; justify-content:center;
  padding:75px 18px 100px;
}
.contacts-panel{
  width:100%; max-width:730px; padding:clamp(28px,5vw,56px);
  border:1px solid #e3e9f0; border-radius:24px;
  box-shadow:0 16px 50px rgba(30,44,83,.06);
  align-self:start; text-align:center;
  background:linear-gradient(145deg,#fff,#f6fafc);
}
.contacts-panel .eyebrow{
  color:#c00c79;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;display:block;margin-bottom:17px;
}
.contacts-panel h1{
  color:#1e2c53; font-size:clamp(31px,5vw,46px);
  letter-spacing:-.04em;margin:0 0 17px
}
.contacts-panel p{line-height:1.7;color:#60718b;font-size:15px}
.contact-email{
  display:inline-flex; align-items:center; gap:10px;
  padding:14px 22px; margin:18px auto 10px; border-radius:100px;
  background:#c00c79; color:white!important; font-weight:700;
  font-size:clamp(14px,2.5vw,18px);
  overflow-wrap:anywhere; text-decoration:none;
}
.contact-email:hover{background:#a50868}
.back-to-shop{display:inline-block;color:#167bc0;margin:25px auto 0;font-size:14px}
.back-to-shop:hover{color:#c00c79}
</style>
<link rel="stylesheet" href="/site-theme.css">
<script src="/site-i18n.js"></script>
</head>
<body>
<header></header>
<main class="contacts-main">
  <section class="contacts-panel" aria-labelledby="contacts-heading">
    <span class="eyebrow">Клуб «5 океанов» × ОКЕАН HD</span>
    <h1 id="contacts-heading">Контакты</h1>
    <p>
      По вопросам товаров, оформления заказов и сотрудничества
      напишите нам на электронную почту клуба.
    </p>
    <a class="contact-email" href="mailto:5oceans.club@gmail.com">
      ✉ 5oceans.club@gmail.com
    </a>
    <div>
      <a class="back-to-shop" href="/">← Вернуться в магазин</a>
    </div>
  </section>
</main>
<footer></footer>
<script src="/site-shell.js"></script>
<script src="/cart-nav.js" defer></script>
</body>
</html>


<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Каталог — Клуб «5 океанов»</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fa;
  color: #14283a;
  font-family: Arial, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ВЕРХНЕЕ МЕНЮ */

header {
  background: #102c43;
  color: white;
  padding: 22px 3%;
}

header nav {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.brand {
  font-weight: bold;
  font-size: 21px;
  white-space: nowrap;
}

/* Ссылки справа */

.menu {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 24px;
  font-size: 14px;
}

.menu .back {
  color: white;
  font-size: inherit;
  font-weight: 400;
  white-space: nowrap;
}

/* Единый стиль корзины и кнопки На главную */

header nav .menu .global-cart-link {
  margin-left: 0;
  font-size: inherit;
  font-weight: 400;
  color: white;
  white-space: nowrap;
}

.menu a:hover {
  color: #c2d9e6;
}

/* ЗАГОЛОВОК КАТЕГОРИИ */

.hero {
  background: #102c43;
  color: white;
  padding: 38px 20px 60px;
  text-align: center;
}

.hero h1 {
  font-size: clamp(30px, 5vw, 48px);
  margin: 0 0 12px;
}

.hero p {
  color: #c2d9e6;
  line-height: 1.5;
}

/* КАТАЛОГ */

main {
  max-width: 1150px;
  margin: 40px auto;
  padding: 0 20px;
  min-height: 35vh;
}

.products {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(240px, 1fr));
  gap: 24px;
}

/* КАРТОЧКА ТОВАРА */

.card {
  display: block;
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px #102c4310;
  transition:
    transform 0.2s,
    box-shadow 0.2s;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 28px #102c4320;
}
.card-photo-link { display:block; }
.card-title-link { color:inherit; }
.card-title-link:hover,.card-title-link:focus-visible { text-decoration:underline; }
.catalog-swatches { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-top:10px; }
.catalog-swatch { width:25px; height:25px; border-radius:50%; border:2px solid #cbd5df;
  background:var(--swatch-color,#bbb); padding:0; cursor:pointer; display:inline-block;
  box-shadow:inset 0 0 0 1px #ffffff88; }
.catalog-swatch.selected { outline:2px solid #102c43; outline-offset:2px; }
.catalog-swatch.unavailable { opacity:.48; position:relative; }
.catalog-swatch.unavailable::after { content:"";position:absolute;inset:10px -3px;
  height:2px;background:#b53636;transform:rotate(-40deg); }
.catalog-swatch:focus-visible { outline:3px solid #146789; outline-offset:3px; }
.catalog-color-name { font-size:12px;color:#617383;margin:8px 0 0; }
.card .open-product { display:inline-block; }


.card img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  background: #edf1f5;
}

.placeholder {
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  background: #edf1f5;
  color: #71808e;
}

.info {
  padding: 20px;
}

.info h3 {
  margin: 0 0 10px;
  font-size: 20px;
}

.description {
  color: #617383;
  line-height: 1.5;
  font-size: 14px;
}

.price {
  font-size: 23px;
  font-weight: bold;
  margin: 18px 0;
}

/* НАЛИЧИЕ */

.status {
  font-size: 13px;
  color: #28734a;
}

.status.off {
  color: #a03b3b;
}

/* РАЗМЕРЫ */

.sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.size {
  padding: 8px 12px;
  border: 1px solid #cbd5df;
  border-radius: 8px;
  font-size: 14px;
}

/* ПЕРЕХОД К ТОВАРУ */

.open-product {
  margin-top: 20px;
  color: #146789;
  font-weight: bold;
  font-size: 14px;
}

.no-link {
  color: #a03b3b;
  font-size: 13px;
}

/* ПОДВАЛ */

footer {
  padding: 40px 20px;
  text-align: center;
  color: #71808e;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media (max-width: 600px) {

  header {
    padding: 18px 14px;
  }

  .brand {
    font-size: 17px;
  }

  .menu {
    gap: 12px;
    font-size: 12px;
  }

  header nav .menu .global-cart-link {
    margin-left: 0;
  }

  main {
    margin-top: 25px;
  }

  .products {
    grid-template-columns:
      repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .info {
    padding: 14px;
  }

  .info h3 {
    font-size: 17px;
  }
}

</style>
<link rel="stylesheet" href="/site-theme.css">
<script src="/site-i18n.js"></script>
</head>

<body>

<!-- ВЕРХНЕЕ МЕНЮ -->

<header>
  <nav>

    <a href="/" class="brand">
      5 ОКЕАНОВ
    </a>

    <div class="menu">
      <a href="/" class="back">
        На главную
      </a>
      <!-- Корзина добавляется через cart-nav.js -->
    </div>

  </nav>
</header>

<!-- ЗАГОЛОВОК КАТЕГОРИИ -->

<section class="hero">

  <h1 id="categoryTitle">Каталог</h1>

  <p id="categoryDescription"></p>

</section>

<!-- ТОВАРЫ -->

<main>

  <nav class="page-back-nav" aria-label="Навигация по каталогу">
    <a class="quiet-back" href="/#catalog">← К категориям</a>
  </nav>

  <div id="products" class="products">
    Загружаем товары...
  </div>

</main>

<footer>
  Клуб «5 океанов»
</footer>

<script>

/* ПАРАМЕТР КАТЕГОРИИ */

const params = new URLSearchParams(
  window.location.search
);

const categorySlug = params.get("slug");

const container = document.getElementById(
  "products"
);

/* СОЗДАНИЕ ЭЛЕМЕНТОВ */

function createElement(tag, className, text) {

  const node = document.createElement(tag);

  if (className) {
    node.className = className;
  }

  if (text !== undefined) {
    node.textContent = text;
  }

  return node;
}

/* СРАВНЕНИЕ КАТЕГОРИЙ */

function normalize(value) {

  return String(value || "")
    .trim()
    .toLowerCase();

}

/* ФОРМАТИРОВАНИЕ ЦЕНЫ */

function formatPrice(price) {

  if (
    price === null ||
    price === undefined ||
    price === ""
  ) {
    return "Цена уточняется";
  }

  return new Intl.NumberFormat("ru-RU", {
    style: "currency",
    currency: "RUB",
    maximumFractionDigits: 0
  }).format(Number(price));
}

function catalogVariant(product, highlight = null) {
  const variants = Array.isArray(product.variants)
    ? product.variants.filter(v => v && /^[a-z0-9][a-z0-9-]{0,24}$/.test(v.code || ""))
    : [];
  const active = variants.filter(v => v.available === true);
  const choices = highlight
    ? active.filter(v => v[highlight] === true)
    : (active.length ? active : variants);
  const hasPhoto = v => Array.isArray(v.photos) && v.photos.some(Boolean);
  return choices.find(hasPhoto) || choices[0] || null;
}
function catalogPhoto(product, highlight = null) {
  const variant = catalogVariant(product, highlight);
  return variant && Array.isArray(variant.photos)
    ? variant.photos.find(Boolean) || null : null;
}
function catalogAvailable(product) {
  return Array.isArray(product.variants) &&
    product.variants.some(v => v && v.available === true);
}
function catalogHighlighted(product, field) {
  return Array.isArray(product.variants) &&
    product.variants.some(v => v && v.available === true && v[field] === true);
}

/* Для каждой модели выбираем очередной цвет раз в три дня.
   Без таймеров или записей на сервер: все посетители видят одинаковую ротацию.
   Неподтвержденные / выключенные цвета не используем для стартовой обложки. */
const COVER_PERIOD_MS = 3 * 24 * 60 * 60 * 1000;
function catalogPhotoVariants(product) {
  return (Array.isArray(product?.variants) ? product.variants : [])
    .filter(v=>v && /^[a-z0-9][a-z0-9-]{0,24}$/.test(v.code||"") &&
      Array.isArray(v.photos) && v.photos.some(Boolean));
}
function coverVariant(product,now=Date.now()) {
  const all=catalogPhotoVariants(product);
  const available=all.filter(v=>v.available===true);
  const choices=available.length?available:all;
  if(!choices.length)return null;
  // Смещение привязано к товару, чтобы весь каталог не переключался на один цвет.
  const offset=Array.from(String(product.product_id||product.slug||""))
    .reduce((sum,c)=>sum+c.charCodeAt(0),0);
  const period=Math.floor(now/COVER_PERIOD_MS);
  return choices[(period+offset)%choices.length];
}
function variantCoverUrl(v) {
  return Array.isArray(v?.photos)?v.photos.find(p=>typeof p==="string"&&p.trim())||null:null;
}
function productUrl(product,variant) {
  return "/product.html?slug="+encodeURIComponent(product.slug.trim())+
    (variant?"&color="+encodeURIComponent(variant.code):"");
}

/* СОЗДАНИЕ КАРТОЧКИ ТОВАРА */
function createProductCard(product) {
  const hasSlug=typeof product.slug==="string"&&product.slug.trim().length>0;
  const card=createElement("article","card");
  let current=coverVariant(product);
  const photoLink=createElement(hasSlug?"a":"div","card-photo-link");
  if(hasSlug)photoLink.href=productUrl(product,current);
  const image=document.createElement("img");
  image.alt=product.title||"Товар";
  image.loading="lazy";
  const blank=createElement("div","placeholder","5 ОКЕАНОВ");
  function selectColor(v) {
    current=v;
    const url=variantCoverUrl(v);
    if(url){
      image.src=url;
      image.alt=(product.title||"Товар")+" — "+v.label;
      photoLink.replaceChildren(image);
    }else photoLink.replaceChildren(blank);
    if(hasSlug)photoLink.href=productUrl(product,v);
    if(titleLink)titleLink.href=productUrl(product,v);
    if(detailLink)detailLink.href=productUrl(product,v);
    if(colorName)colorName.textContent=v?.label||"";
    if(swatches)swatches.querySelectorAll("button").forEach(btn=>{
      const isSelected=btn.dataset.color===v?.code;
      btn.classList.toggle("selected",isSelected);
      btn.setAttribute("aria-pressed",isSelected?"true":"false");
    });
  }
  let titleLink=null,detailLink=null,colorName=null,swatches=null;
  card.appendChild(photoLink);

  const info=createElement("div","info");
  const heading=createElement("h3","");
  titleLink=createElement(hasSlug?"a":"span","card-title-link",product.title||"Товар");
  if(hasSlug)titleLink.href=productUrl(product,current);
  heading.appendChild(titleLink);
  info.appendChild(heading);
  info.appendChild(createElement("p","price",formatPrice(product.price)));

  /* Цвета вместо размеров. По нажатию / наведению меняется фото и ссылка
     на конкретный цвет; нет перехода из категории до нажатия на фото / ссылку. */
  const variants=(Array.isArray(product.variants)?product.variants:[])
    .filter(v=>v && /^[a-z0-9][a-z0-9-]{0,24}$/.test(v.code||""));
  if(variants.length){
    info.appendChild(createElement("p","catalog-color-name","Цвета в каталоге:"));
    swatches=createElement("div","catalog-swatches");
    swatches.setAttribute("role","group");
    swatches.setAttribute("aria-label","Цвета товара");
    variants.forEach(v=>{
      const btn=createElement("button","catalog-swatch");
      btn.type="button";
      btn.dataset.color=v.code;
      btn.title=v.label+(v.available===true?"":" — временно недоступен");
      btn.setAttribute("aria-label",btn.title);
      btn.style.setProperty("--swatch-color",/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(v.hex||"")?v.hex:"#bbb");
      if(v.available!==true)btn.classList.add("unavailable");
      btn.addEventListener("click",()=>selectColor(v));
      btn.addEventListener("mouseenter",()=>selectColor(v));
      btn.addEventListener("focus",()=>selectColor(v));
      swatches.appendChild(btn);
    });
    info.appendChild(swatches);
    colorName=createElement("p","catalog-color-name","");
    info.appendChild(colorName);
  }
  if(hasSlug){
    detailLink=createElement("a","open-product","Подробнее о товаре →");
    detailLink.href=productUrl(product,current);
    info.appendChild(detailLink);
  }else info.appendChild(createElement("div","no-link","Страница товара пока не настроена"));
  card.appendChild(info);
  if(current)selectColor(current);
  else photoLink.appendChild(blank);
  return card;
}

/* ЗАГРУЗКА КАТЕГОРИИ */

async function loadCategory() {

  try {

    if (!categorySlug) {
      throw new Error(
        "Не указан адрес категории"
      );
    }

    const responses = await Promise.all([

      fetch("/data/categories.json", {
        cache: "no-store"
      }),

      fetch("/data/products.json", {
        cache: "no-store"
      })

    ]);

    if (responses.some(r => !r.ok)) {
      throw new Error(
        "Не удалось загрузить данные"
      );
    }

    const [categories, products] =
      await Promise.all(
        responses.map(r => r.json())
      );

    if (
      !Array.isArray(categories) ||
      !Array.isArray(products)
    ) {
      throw new Error(
        "Неверный формат данных"
      );
    }

    categories.splice(0,categories.length,...(window.StoreI18n?.categories(categories) || categories));
    products.splice(0,products.length,...(window.StoreI18n?.products(products) || products));

    /* Поиск категории */

    const category = categories.find(c =>
      normalize(c.slug) === normalize(categorySlug)
    );

    if (!category) {

      document.getElementById(
        "categoryTitle"
      ).textContent = "Категория не найдена";

      container.textContent =
        "Вернитесь на главную страницу.";

      return;
    }

    /* Заголовок */

    document.title =
      category.title + " — 5 океанов";

    document.getElementById(
      "categoryTitle"
    ).textContent = category.title;

    document.getElementById(
      "categoryDescription"
    ).textContent = category.description || "";

    /* Черновики не видны в публичном каталоге. */
    const visibleProducts = products.filter(p => p && p.published === true);

    /* Фильтрация товаров */

    const matchingProducts = visibleProducts.filter(
      product =>
        normalize(product.category) ===
        normalize(category.id)
    );

    container.replaceChildren();

    if (matchingProducts.length === 0) {

      container.textContent =
        "В этой категории пока нет товаров.";

      return;
    }

    /* Вывод карточек */

    matchingProducts.forEach(product => {

      const card = createProductCard(product);

      container.appendChild(card);

    });

  } catch (error) {

    console.error(
      "Ошибка загрузки категории:",
      error
    );

    container.textContent =
      "Не удалось загрузить товары. " +
      "Попробуйте обновить страницу.";
  }
}

/* ЗАПУСК */

loadCategory();

</script>

<!-- ЕДИНАЯ КОРЗИНА -->

<script src="/site-shell.js"></script>
<script src="/cart-nav.js" defer></script>

</body>
</html>

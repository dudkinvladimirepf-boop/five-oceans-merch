
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Каталог — Клуб «5 океанов»</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fa;
  color: #14283a;
  font-family: Arial, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Верхнее меню */

header {
  background: #102c43;
  color: white;
  padding: 22px 6%;
}

nav {
  max-width: 1150px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  font-weight: bold;
  font-size: 21px;
}

.back {
  color: #c2d9e6;
  font-size: 14px;
}

/* Заголовок категории */

.hero {
  background: #102c43;
  color: white;
  padding: 38px 20px 60px;
  text-align: center;
}

.hero h1 {
  font-size: clamp(30px, 5vw, 48px);
  margin: 0 0 12px;
}

.hero p {
  color: #c2d9e6;
  line-height: 1.5;
}

/* Каталог */

main {
  max-width: 1150px;
  margin: 40px auto;
  padding: 0 20px;
  min-height: 35vh;
}

.products {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(240px, 1fr));
  gap: 24px;
}

/* Карточка товара */

.card {
  display: block;
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px #102c4310;
  transition: transform 0.2s,
              box-shadow 0.2s;
}

a.card {
  cursor: pointer;
}

a.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 28px #102c4320;
}

.card img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  background: #edf1f5;
}

.placeholder {
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  background: #edf1f5;
  color: #71808e;
}

.info {
  padding: 20px;
}

.info h3 {
  margin: 0 0 10px;
  font-size: 20px;
}

.description {
  color: #617383;
  line-height: 1.5;
  font-size: 14px;
}

.price {
  font-size: 23px;
  font-weight: bold;
  margin: 18px 0;
}

/* Наличие */

.status {
  font-size: 13px;
  color: #28734a;
}

.status.off {
  color: #a03b3b;
}

/* Размеры */

.sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.size {
  padding: 8px 12px;
  border: 1px solid #cbd5df;
  border-radius: 8px;
  font-size: 14px;
}

/* Ссылка на подробную карточку */

.open-product {
  margin-top: 20px;
  color: #146789;
  font-weight: bold;
  font-size: 14px;
}

.no-link {
  color: #a03b3b;
  font-size: 13px;
}

/* Нижняя часть */

footer {
  padding: 40px 20px;
  text-align: center;
  color: #71808e;
}

/* Телефоны */

@media (max-width: 600px) {
  header {
    padding: 18px;
  }

  .brand {
    font-size: 18px;
  }

  main {
    margin-top: 25px;
  }

  .products {
    grid-template-columns:
      repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .info {
    padding: 14px;
  }

  .info h3 {
    font-size: 17px;
  }
}
</style>
</head>

<body>

<header>
  <nav>
    <a href="/" class="brand">
      5 ОКЕАНОВ
    </a>

    <a href="/" class="back">
      ← На главную
    </a>
  </nav>
</header>

<section class="hero">
  <h1 id="categoryTitle">Каталог</h1>
  <p id="categoryDescription"></p>
</section>

<main>
  <div id="products" class="products">
    Загружаем товары...
  </div>
</main>

<footer>
  Клуб «5 океанов»
</footer>

<script>

/* Получаем категорию из адреса */

const params = new URLSearchParams(
  window.location.search
);

const categorySlug = params.get("slug");

const container = document.getElementById(
  "products"
);

/* Создание безопасных HTML-элементов */

function createElement(tag, className, text) {
  const node = document.createElement(tag);

  if (className) {
    node.className = className;
  }

  if (text !== undefined) {
    node.textContent = text;
  }

  return node;
}

/* Сравнение категорий */

function normalize(value) {
  return String(value || "")
    .trim()
    .toLowerCase();
}

/* Форматирование цены */

function formatPrice(price) {
  if (price === null ||
      price === undefined ||
      price === "") {
    return "Цена уточняется";
  }

  return new Intl.NumberFormat("ru-RU", {
    style: "currency",
    currency: "RUB",
    maximumFractionDigits: 0
  }).format(Number(price));
}

/* Создание карточки товара */

function createProductCard(product) {

  const hasSlug =
    typeof product.slug === "string" &&
    product.slug.trim().length > 0;

  /*
    Если у товара есть slug,
    создаём кликабельную карточку.
  */

  const card = createElement(
    hasSlug ? "a" : "article",
    "card"
  );

  if (hasSlug) {
    card.href = "/product.html?slug=" +
      encodeURIComponent(product.slug.trim());
  }

  /* Фотография */

  const photos = Array.isArray(product.photos)
    ? product.photos.filter(Boolean)
    : [];

  if (photos.length > 0) {

    const img = document.createElement("img");

    img.src = photos[0];
    img.alt = product.title || "Товар";
    img.loading = "lazy";

    card.appendChild(img);

  } else {

    card.appendChild(
      createElement(
        "div",
        "placeholder",
        "5 ОКЕАНОВ"
      )
    );

  }

  /* Информация о товаре */

  const info = createElement("div", "info");

  info.appendChild(
    createElement(
      "h3",
      "",
      product.title || "Товар"
    )
  );

  /* Описание */

  if (product.description) {
    info.appendChild(
      createElement(
        "p",
        "description",
        product.description
      )
    );
  }

  /* Цена */

  info.appendChild(
    createElement(
      "p",
      "price",
      formatPrice(product.price)
    )
  );

  /* Наличие */

  const available = product.available === true;

  info.appendChild(
    createElement(
      "p",
      available ? "status" : "status off",
      available ? "В наличии" : "Нет в наличии"
    )
  );

  /* Размеры */

  const sizes = Array.isArray(product.sizes)
    ? product.sizes.filter(Boolean)
    : [];

  if (available && sizes.length > 0) {

    info.appendChild(
      createElement(
        "p",
        "",
        "Размеры в наличии:"
      )
    );

    const sizeContainer = createElement(
      "div",
      "sizes"
    );

    sizes.forEach(size => {
      sizeContainer.appendChild(
        createElement("span", "size", size)
      );
    });

    info.appendChild(sizeContainer);
  }

  /* Переход на страницу товара */

  if (hasSlug) {

    info.appendChild(
      createElement(
        "div",
        "open-product",
        "Подробнее о товаре →"
      )
    );

  } else {

    info.appendChild(
      createElement(
        "div",
        "no-link",
        "Страница товара пока не настроена"
      )
    );

  }

  card.appendChild(info);

  return card;
}

/* Загрузка каталога */

async function loadCategory() {

  try {

    if (!categorySlug) {
      throw new Error(
        "Не указан адрес категории"
      );
    }

    /* Получаем данные */

    const responses = await Promise.all([

      fetch("/data/categories.json", {
        cache: "no-store"
      }),

      fetch("/data/products.json", {
        cache: "no-store"
      })

    ]);

    if (responses.some(r => !r.ok)) {
      throw new Error(
        "Не удалось загрузить данные"
      );
    }

    const [categories, products] =
      await Promise.all(
        responses.map(r => r.json())
      );

    if (!Array.isArray(categories) ||
        !Array.isArray(products)) {
      throw new Error(
        "Неверный формат данных"
      );
    }

    /* Находим нужную категорию */

    const category = categories.find(c =>
      normalize(c.slug) === normalize(categorySlug)
    );

    if (!category) {

      document.getElementById(
        "categoryTitle"
      ).textContent = "Категория не найдена";

      container.textContent =
        "Вернитесь на главную страницу.";

      return;
    }

    /* Показываем название категории */

    document.title =
      category.title + " — 5 океанов";

    document.getElementById(
      "categoryTitle"
    ).textContent = category.title;

    document.getElementById(
      "categoryDescription"
    ).textContent = category.description || "";

    /* Отбираем товары категории */

    const matchingProducts = products.filter(
      product =>
        normalize(product.category) ===
        normalize(category.id)
    );

    /* Очищаем старое содержимое */

    container.replaceChildren();

    /* Если товаров нет */

    if (matchingProducts.length === 0) {

      container.textContent =
        "В этой категории пока нет товаров.";

      return;
    }

    /* Создаём карточку каждого товара */

    matchingProducts.forEach(product => {

      const card = createProductCard(product);

      container.appendChild(card);

    });

  } catch (error) {

    console.error(
      "Ошибка загрузки категории:",
      error
    );

    container.textContent =
      "Не удалось загрузить товары. " +
      "Попробуйте обновить страницу.";

  }
}

/* Запускаем загрузку */

loadCategory();


</script>

<script src="/cart-nav.js" defer></script>

</body>
</html>


<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Каталог — Клуб «5 океанов»</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fa;
  color: #14283a;
  font-family: Arial, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ВЕРХНЕЕ МЕНЮ */

header {
  background: #102c43;
  color: white;
  padding: 22px 3%;
}

header nav {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.brand {
  font-weight: bold;
  font-size: 21px;
  white-space: nowrap;
}

/* Ссылки справа */

.menu {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 24px;
  font-size: 14px;
}

.menu .back {
  color: white;
  font-size: inherit;
  font-weight: 400;
  white-space: nowrap;
}

/* Единый стиль корзины и кнопки На главную */

header nav .menu .global-cart-link {
  margin-left: 0;
  font-size: inherit;
  font-weight: 400;
  color: white;
  white-space: nowrap;
}

.menu a:hover {
  color: #c2d9e6;
}

/* ЗАГОЛОВОК КАТЕГОРИИ */

.hero {
  background: #102c43;
  color: white;
  padding: 38px 20px 60px;
  text-align: center;
}

.hero h1 {
  font-size: clamp(30px, 5vw, 48px);
  margin: 0 0 12px;
}

.hero p {
  color: #c2d9e6;
  line-height: 1.5;
}

/* КАТАЛОГ */

main {
  max-width: 1150px;
  margin: 40px auto;
  padding: 0 20px;
  min-height: 35vh;
}

.products {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(240px, 1fr));
  gap: 24px;
}

/* КАРТОЧКА ТОВАРА */

.card {
  display: block;
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 20px #102c4310;
  transition:
    transform 0.2s,
    box-shadow 0.2s;
}

a.card {
  cursor: pointer;
}

a.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 28px #102c4320;
}

.card img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  background: #edf1f5;
}

.placeholder {
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  background: #edf1f5;
  color: #71808e;
}

.info {
  padding: 20px;
}

.info h3 {
  margin: 0 0 10px;
  font-size: 20px;
}

.description {
  color: #617383;
  line-height: 1.5;
  font-size: 14px;
}

.price {
  font-size: 23px;
  font-weight: bold;
  margin: 18px 0;
}

/* НАЛИЧИЕ */

.status {
  font-size: 13px;
  color: #28734a;
}

.status.off {
  color: #a03b3b;
}

/* РАЗМЕРЫ */

.sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.size {
  padding: 8px 12px;
  border: 1px solid #cbd5df;
  border-radius: 8px;
  font-size: 14px;
}

/* ПЕРЕХОД К ТОВАРУ */

.open-product {
  margin-top: 20px;
  color: #146789;
  font-weight: bold;
  font-size: 14px;
}

.no-link {
  color: #a03b3b;
  font-size: 13px;
}

/* ПОДВАЛ */

footer {
  padding: 40px 20px;
  text-align: center;
  color: #71808e;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media (max-width: 600px) {

  header {
    padding: 18px 14px;
  }

  .brand {
    font-size: 17px;
  }

  .menu {
    gap: 12px;
    font-size: 12px;
  }

  header nav .menu .global-cart-link {
    margin-left: 0;
  }

  main {
    margin-top: 25px;
  }

  .products {
    grid-template-columns:
      repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .info {
    padding: 14px;
  }

  .info h3 {
    font-size: 17px;
  }
}

</style>
<link rel="stylesheet" href="/site-theme.css">
</head>

<body>

<!-- ВЕРХНЕЕ МЕНЮ -->

<header>
  <nav>

    <a href="/" class="brand">
      5 ОКЕАНОВ
    </a>

    <div class="menu">
      <a href="/" class="back">
        На главную
      </a>
      <!-- Корзина добавляется через cart-nav.js -->
    </div>

  </nav>
</header>

<!-- ЗАГОЛОВОК КАТЕГОРИИ -->

<section class="hero">

  <h1 id="categoryTitle">Каталог</h1>

  <p id="categoryDescription"></p>

</section>

<!-- ТОВАРЫ -->

<main>

  <nav class="page-back-nav" aria-label="Навигация по каталогу">
    <a class="quiet-back" href="/#catalog">← К категориям</a>
  </nav>

  <div id="products" class="products">
    Загружаем товары...
  </div>

</main>

<footer>
  Клуб «5 океанов»
</footer>

<script>

/* ПАРАМЕТР КАТЕГОРИИ */

const params = new URLSearchParams(
  window.location.search
);

const categorySlug = params.get("slug");

const container = document.getElementById(
  "products"
);

/* СОЗДАНИЕ ЭЛЕМЕНТОВ */

function createElement(tag, className, text) {

  const node = document.createElement(tag);

  if (className) {
    node.className = className;
  }

  if (text !== undefined) {
    node.textContent = text;
  }

  return node;
}

/* СРАВНЕНИЕ КАТЕГОРИЙ */

function normalize(value) {

  return String(value || "")
    .trim()
    .toLowerCase();

}

/* ФОРМАТИРОВАНИЕ ЦЕНЫ */

function formatPrice(price) {

  if (
    price === null ||
    price === undefined ||
    price === ""
  ) {
    return "Цена уточняется";
  }

  return new Intl.NumberFormat("ru-RU", {
    style: "currency",
    currency: "RUB",
    maximumFractionDigits: 0
  }).format(Number(price));
}

function catalogVariant(product, highlight = null) {
  const variants = Array.isArray(product.variants)
    ? product.variants.filter(v => v && /^[a-z0-9][a-z0-9-]{0,24}$/.test(v.code || ""))
    : [];
  const active = variants.filter(v => v.available === true);
  const choices = highlight
    ? active.filter(v => v[highlight] === true)
    : (active.length ? active : variants);
  const hasPhoto = v => Array.isArray(v.photos) && v.photos.some(Boolean);
  return choices.find(hasPhoto) || choices[0] || null;
}
function catalogPhoto(product, highlight = null) {
  const variant = catalogVariant(product, highlight);
  return variant && Array.isArray(variant.photos)
    ? variant.photos.find(Boolean) || null : null;
}
function catalogAvailable(product) {
  return Array.isArray(product.variants) &&
    product.variants.some(v => v && v.available === true);
}
function catalogHighlighted(product, field) {
  return Array.isArray(product.variants) &&
    product.variants.some(v => v && v.available === true && v[field] === true);
}

/* СОЗДАНИЕ КАРТОЧКИ ТОВАРА */

function createProductCard(product) {

  const hasSlug =
    typeof product.slug === "string" &&
    product.slug.trim().length > 0;

  const card = createElement(
    hasSlug ? "a" : "article",
    "card"
  );

  if (hasSlug) {
    const selectedColor = catalogVariant(product);
    card.href = "/product.html?slug=" +
      encodeURIComponent(product.slug.trim()) +
      (selectedColor ? "&color=" + encodeURIComponent(selectedColor.code) : "");
  }

  /* Фотографии */

  const photos = catalogPhoto(product) ? [catalogPhoto(product)] : [];

  if (photos.length > 0) {

    const img = document.createElement("img");

    img.src = photos[0];
    img.alt = product.title || "Товар";
    img.loading = "lazy";

    card.appendChild(img);

  } else {

    card.appendChild(
      createElement(
        "div",
        "placeholder",
        "5 ОКЕАНОВ"
      )
    );
  }

  /* Информация */

  const info = createElement("div", "info");

  info.appendChild(
    createElement(
      "h3",
      "",
      product.title || "Товар"
    )
  );

  /* Полное описание показывается только на странице товара. */

  /* Цена */

  info.appendChild(
    createElement(
      "p",
      "price",
      formatPrice(product.price)
    )
  );

  /* Статус наличия используем только для логики показа размеров. */
  const available = catalogAvailable(product);

  /* Размеры */

  const selected = catalogVariant(product);
  const sizes = Array.isArray(selected?.sizes)
    ? selected.sizes.filter(Boolean) : [];

  if (available && sizes.length > 0) {

    info.appendChild(
      createElement(
        "p",
        "",
        "Размеры в наличии:"
      )
    );

    const sizeContainer = createElement(
      "div",
      "sizes"
    );

    sizes.forEach(size => {
      sizeContainer.appendChild(
        createElement("span", "size", size)
      );
    });

    info.appendChild(sizeContainer);
  }

  /* Ссылка на товар */

  if (hasSlug) {

    info.appendChild(
      createElement(
        "div",
        "open-product",
        "Подробнее о товаре →"
      )
    );

  } else {

    info.appendChild(
      createElement(
        "div",
        "no-link",
        "Страница товара пока не настроена"
      )
    );
  }

  card.appendChild(info);

  return card;
}

/* ЗАГРУЗКА КАТЕГОРИИ */

async function loadCategory() {

  try {

    if (!categorySlug) {
      throw new Error(
        "Не указан адрес категории"
      );
    }

    const responses = await Promise.all([

      fetch("/data/categories.json", {
        cache: "no-store"
      }),

      fetch("/data/products.json", {
        cache: "no-store"
      })

    ]);

    if (responses.some(r => !r.ok)) {
      throw new Error(
        "Не удалось загрузить данные"
      );
    }

    const [categories, products] =
      await Promise.all(
        responses.map(r => r.json())
      );

    if (
      !Array.isArray(categories) ||
      !Array.isArray(products)
    ) {
      throw new Error(
        "Неверный формат данных"
      );
    }

    /* Поиск категории */

    const category = categories.find(c =>
      normalize(c.slug) === normalize(categorySlug)
    );

    if (!category) {

      document.getElementById(
        "categoryTitle"
      ).textContent = "Категория не найдена";

      container.textContent =
        "Вернитесь на главную страницу.";

      return;
    }

    /* Заголовок */

    document.title =
      category.title + " — 5 океанов";

    document.getElementById(
      "categoryTitle"
    ).textContent = category.title;

    document.getElementById(
      "categoryDescription"
    ).textContent = category.description || "";

    /* Фильтрация товаров */

    const matchingProducts = products.filter(
      product =>
        normalize(product.category) ===
        normalize(category.id)
    );

    container.replaceChildren();

    if (matchingProducts.length === 0) {

      container.textContent =
        "В этой категории пока нет товаров.";

      return;
    }

    /* Вывод карточек */

    matchingProducts.forEach(product => {

      const card = createProductCard(product);

      container.appendChild(card);

    });

  } catch (error) {

    console.error(
      "Ошибка загрузки категории:",
      error
    );

    container.textContent =
      "Не удалось загрузить товары. " +
      "Попробуйте обновить страницу.";
  }
}

/* ЗАПУСК */

loadCategory();

</script>

<!-- ЕДИНАЯ КОРЗИНА -->

<script src="/site-shell.js"></script>
<script src="/cart-nav.js" defer></script>

</body>
</html>

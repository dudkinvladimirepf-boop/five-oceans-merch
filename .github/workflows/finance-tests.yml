name: Finance checks
on:
  pull_request:
    paths:
      - "functions/finance.js"
      - "functions/api/finance/import.js"
      - "finance.test.cjs"
      - "finance-opening.test.cjs"
      - "finance-price-correction.test.cjs"
      - "finance-receipt-ui.test.cjs"
      - "finance-unified.test.cjs"
      - "test-crm-cleanup.test.cjs"
      - "finance-layout.test.cjs"
      - "finance-color-opt-in.test.cjs"
      - "catalog-finance-bulk.test.cjs"
      - "home-showcase-rotation.test.cjs"
      - "index.html"
      - "site-theme.css"
      - "site-i18n.js"
      - "site-shell.js"
      - "store-i18n.test.cjs"
      - "cart.html"
      - "product.html"
      - "search.html"
      - "contacts.html"
      - "data/categories.json"
      - "category.html"
      - ".github/workflows/finance-import.yml"
      - "finance-forms.js"
      - "migrations/2026-10-23-finance-opening-batches.sql"
      - "functions/developers.js"
      - "data/products.json"
      - ".pages.yml"
      - "migrations/2026-10-23-finance-mvp.sql"
      - ".github/workflows/finance-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check functions/finance.js
      - run: node --check finance-forms.js
      - run: node --check site-i18n.js
      - run: node --check site-shell.js
      - run: node --check functions/api/finance/import.js
      - run: node --test finance.test.cjs finance-opening.test.cjs finance-price-correction.test.cjs finance-receipt-ui.test.cjs finance-unified.test.cjs test-crm-cleanup.test.cjs finance-layout.test.cjs finance-color-opt-in.test.cjs catalog-finance-bulk.test.cjs home-showcase-rotation.test.cjs checkout.test.cjs inventory-sync.test.cjs store-i18n.test.cjs

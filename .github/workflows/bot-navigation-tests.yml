name: Telegram bot navigation checks

on:
  pull_request:
    paths:
      - "bot/**"
      - ".github/workflows/deploy-telegram-bot.yml"
      - ".github/workflows/bot-navigation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check bot/worker.js
      - name: Run navigation tests without contacting production
        run: node --test bot/navigation.test.mjs
